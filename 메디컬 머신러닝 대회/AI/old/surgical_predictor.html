<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수술 위험도 & 시간 예측</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f4f6f8;
  color: #1a1a1a;
  min-height: 100vh;
}

.app { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; }

.header { text-align: center; margin-bottom: 1.5rem; }
.header h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.header p { font-size: 13px; color: #666; }
.badge {
  display: inline-block; font-size: 11px;
  background: #dbeafe; color: #1d4ed8;
  padding: 3px 10px; border-radius: 20px; margin-bottom: 10px;
}

.card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 1.25rem;
  margin-bottom: 1rem;
}

.card-title {
  font-size: 14px; font-weight: 600;
  margin-bottom: 1rem;
  display: flex; align-items: center; gap: 8px; color: #374151;
}
.card-title i { font-size: 16px; color: #6b7280; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: #6b7280; font-weight: 500; }
.field input, .field select {
  border: 1px solid #d1d5db;
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 14px;
  background: #f9fafb;
  color: #1a1a1a;
  width: 100%;
  transition: border-color 0.15s;
}
.field input:focus, .field select:focus {
  outline: none; border-color: #3b82f6;
  background: #fff;
}

.btn-predict {
  width: 100%; padding: 13px;
  background: #1d4ed8; color: #fff;
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 0.25rem;
  transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-predict:hover { background: #1e40af; }
.btn-predict:disabled { background: #93c5fd; cursor: not-allowed; }

.loading {
  text-align: center; padding: 2.5rem;
  color: #6b7280; font-size: 14px; display: none;
}
.loading.visible { display: block; }

.dot-pulse { margin-bottom: 10px; }
.dot-pulse span {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; background: #9ca3af; margin: 0 3px;
  animation: pulse 1.2s ease-in-out infinite;
}
.dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
.dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse {
  0%,80%,100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

.results { display: none; }
.results.visible { display: block; }

.divider {
  text-align: center; font-size: 12px; color: #9ca3af;
  margin: 1rem 0 0.5rem;
}

.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }

.metric-box {
  background: #f3f4f6; border-radius: 10px;
  padding: 1rem; text-align: center; margin-bottom: 0.75rem;
}
.metric-label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
.metric-value { font-size: 32px; font-weight: 700; }
.metric-sub { font-size: 12px; color: #9ca3af; margin-top: 2px; }

.risk-low { color: #059669; }
.risk-mid { color: #d97706; }
.risk-high { color: #dc2626; }

.gauge-bar {
  height: 10px; background: #e5e7eb;
  border-radius: 99px; overflow: hidden;
  margin-bottom: 0.75rem;
}
.gauge-fill { height: 100%; border-radius: 99px; transition: width 0.8s ease; }
.gauge-fill.low  { background: #10b981; }
.gauge-fill.mid  { background: #f59e0b; }
.gauge-fill.high { background: #ef4444; }

.surgery-time-display {
  display: flex; align-items: baseline; gap: 6px; justify-content: center;
}
.surgery-time-num { font-size: 40px; font-weight: 700; }
.surgery-time-unit { font-size: 16px; color: #6b7280; }

.factors { margin-top: 0.5rem; }
.factor-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px;
}
.factor-item:last-child { border-bottom: none; }
.factor-name { color: #6b7280; }
.factor-badge {
  font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: 500;
}
.badge-danger { background: #fee2e2; color: #b91c1c; }
.badge-warn   { background: #fef3c7; color: #92400e; }
.badge-ok     { background: #d1fae5; color: #065f46; }

.recommendation {
  background: #eff6ff; border-left: 3px solid #3b82f6;
  border-radius: 8px; padding: 1rem;
  font-size: 13px; line-height: 1.7; color: #374151;
}

.timeline {
  display: flex; align-items: center;
  margin: 0.75rem 0; font-size: 12px;
}
.tl-item { flex: 1; text-align: center; }
.tl-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #d1d5db; margin: 0 auto 4px;
  transition: background 0.3s;
}
.tl-dot.active { background: #10b981; }
.tl-line { flex: 1; height: 2px; background: #e5e7eb; }
.tl-label { color: #6b7280; }

@media (max-width: 500px) {
  .grid-2, .grid-3, .result-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="badge">Medical AI Dataton 2026</div>
    <h1>수술 위험도 & 시간 예측</h1>
    <p>환자 정보를 입력하면 ICU 입원 위험도와 예상 수술 시간을 예측합니다</p>
  </div>

  <!-- 환자 기본 정보 -->
  <div class="card">
    <div class="card-title">
      <i class="ti ti-user"></i> 환자 기본 정보
    </div>
    <div class="grid-3" style="margin-bottom:12px;">
      <div class="field">
        <label>나이</label>
        <input type="number" id="age" value="58" min="0" max="120" placeholder="세">
      </div>
      <div class="field">
        <label>성별</label>
        <select id="sex">
          <option value="M">남성</option>
          <option value="F">여성</option>
        </select>
      </div>
      <div class="field">
        <label>ASA 점수</label>
        <select id="asa">
          <option value="1">1 (건강)</option>
          <option value="2">2 (경미한 질환)</option>
          <option value="3" selected>3 (중등도 질환)</option>
          <option value="4">4 (중증 질환)</option>
          <option value="5">5 (위험)</option>
        </select>
      </div>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>체중 (kg)</label>
        <input type="number" id="weight" value="68" min="10" max="250">
      </div>
      <div class="field">
        <label>신장 (cm)</label>
        <input type="number" id="height" value="168" min="50" max="230">
      </div>
    </div>
  </div>

  <!-- 수술 정보 -->
  <div class="card">
    <div class="card-title">
      <i class="ti ti-stethoscope"></i> 수술 정보
    </div>
    <div class="grid-2" style="margin-bottom:12px;">
      <div class="field">
        <label>진료과</label>
        <select id="dept">
          <option value="GS">일반외과 (General Surgery)</option>
          <option value="CTS">흉부외과 (Cardio-Thoracic)</option>
          <option value="NS">신경외과 (Neurosurgery)</option>
          <option value="OS">정형외과 (Orthopedic)</option>
          <option value="OG">산부인과 (Ob/Gyn)</option>
          <option value="UR">비뇨기과 (Urology)</option>
          <option value="PS">성형외과 (Plastic Surgery)</option>
          <option value="OL">안과 (Ophthalmology)</option>
        </select>
      </div>
      <div class="field">
        <label>마취 유형</label>
        <select id="antype">
          <option value="General" selected>전신마취</option>
          <option value="Neuraxial">척추/경막외마취</option>
          <option value="Regional">부위마취</option>
          <option value="MAC">감시마취관리</option>
        </select>
      </div>
    </div>
    <div class="grid-2" style="margin-bottom:12px;">
      <div class="field">
        <label>주요 진단명</label>
        <input type="text" id="diagnosis" value="대장암" placeholder="예: 대장암, 담낭염, 척추협착증">
      </div>
      <div class="field">
        <label>수술 종류</label>
        <input type="text" id="surgery_type" value="복강경 대장절제술" placeholder="예: 복강경 대장절제술">
      </div>
    </div>
    <div class="grid-2">
      <div class="field">
        <label>응급 수술 여부</label>
        <select id="emop">
          <option value="0">아니오 (계획 수술)</option>
          <option value="1">예 (응급 수술)</option>
        </select>
      </div>
      <div class="field">
        <label>기저 진단 수</label>
        <input type="number" id="diag_count" value="3" min="0" max="50" placeholder="개">
      </div>
    </div>
  </div>

  <button class="btn-predict" id="predictBtn" onclick="predict()">
    <i class="ti ti-activity-heartbeat"></i> 예측 시작
  </button>

  <!-- 로딩 -->
  <div class="loading" id="loading">
    <div class="dot-pulse"><span></span><span></span><span></span></div>
    <div>AI 모델 분석 중...</div>
  </div>

  <!-- 결과 -->
  <div class="results" id="results">
    <div class="divider">── 예측 결과 ──</div>

    <div class="result-grid">
      <!-- ICU 위험도 -->
      <div class="card" style="margin:0;">
        <div class="card-title">
          <i class="ti ti-alert-triangle"></i> ICU 입원 위험도
        </div>
        <div class="metric-box">
          <div class="metric-label">위험 확률</div>
          <div class="metric-value" id="riskPct">—</div>
          <div class="metric-sub" id="riskLabel">—</div>
        </div>
        <div class="gauge-bar">
          <div class="gauge-fill" id="gaugeFill" style="width:0%"></div>
        </div>
        <div class="factors" id="riskFactors"></div>
      </div>

      <!-- 수술 시간 -->
      <div class="card" style="margin:0;">
        <div class="card-title">
          <i class="ti ti-clock"></i> 예상 수술 시간
        </div>
        <div class="metric-box">
          <div class="metric-label">예상 소요 시간</div>
          <div class="surgery-time-display">
            <span class="surgery-time-num" id="surgeryTime">—</span>
            <span class="surgery-time-unit">분</span>
          </div>
          <div class="metric-sub" id="surgeryTimeRange">—</div>
        </div>
        <div class="timeline">
          <div class="tl-item">
            <div class="tl-dot active"></div>
            <div class="tl-label">마취 시작</div>
          </div>
          <div class="tl-line"></div>
          <div class="tl-item">
            <div class="tl-dot active"></div>
            <div class="tl-label">수술 시작</div>
          </div>
          <div class="tl-line"></div>
          <div class="tl-item">
            <div class="tl-dot" id="tlEnd"></div>
            <div class="tl-label" id="tlEndLabel">수술 종료</div>
          </div>
        </div>
        <div class="factors" id="timeFactors"></div>
      </div>
    </div>

    <!-- 종합 소견 -->
    <div class="card">
      <div class="card-title">
        <i class="ti ti-bulb"></i> 종합 소견 및 권고사항
      </div>
      <div class="recommendation" id="recommendation">—</div>
    </div>
  </div>
</div>

<script>
async function predict() {
  const btn = document.getElementById('predictBtn');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');

  const age = document.getElementById('age').value;
  const sex = document.getElementById('sex').value;
  const asa = document.getElementById('asa').value;
  const weight = document.getElementById('weight').value;
  const height = document.getElementById('height').value;
  const deptEl = document.getElementById('dept');
  const dept = deptEl.options[deptEl.selectedIndex].text;
  const antype = document.getElementById('antype').value;
  const diagnosis = document.getElementById('diagnosis').value;
  const surgery = document.getElementById('surgery_type').value;
  const emop = document.getElementById('emop').value;
  const diagCount = document.getElementById('diag_count').value;

  btn.disabled = true;
  loading.classList.add('visible');
  results.classList.remove('visible');

  const prompt = `당신은 수술 위험도를 예측하는 AI 모델입니다. 아래 환자 데이터를 분석하여 JSON으로만 응답하세요.

환자 정보:
- 나이: ${age}세
- 성별: ${sex === 'M' ? '남성' : '여성'}
- ASA 점수: ${asa} (1=건강 ~ 5=위험)
- 체중: ${weight}kg, 신장: ${height}cm
- 진료과: ${dept}
- 마취 유형: ${antype}
- 주요 진단명: ${diagnosis}
- 수술 종류: ${surgery}
- 응급 수술: ${emop === '1' ? '예' : '아니오'}
- 기저 진단 수: ${diagCount}개

LightGBM 모델 기반으로 다음을 예측하세요:
1. ICU 입원 확률 (0~100 사이 숫자)
2. 예상 수술 시간 (분 단위 숫자)
3. 위험도에 영향 준 주요 요인 3가지
4. 수술 시간에 영향 준 주요 요인 3가지
5. 종합 소견 (2~3문장)

반드시 아래 JSON 형식으로만 응답 (다른 텍스트 없이):
{
  "icu_prob": 숫자,
  "surgery_min": 숫자,
  "risk_factors": [{"name": "요인명", "value": "값", "impact": "high|mid|ok"}],
  "time_factors": [{"name": "요인명", "value": "값", "impact": "high|mid|ok"}],
  "recommendation": "소견 텍스트"
}`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await res.json();
    let text = data.content[0].text.trim();
    text = text.replace(/```json|```/g, '').trim();
    const result = JSON.parse(text);
    showResults(result);

  } catch (e) {
    alert('예측 중 오류가 발생했습니다. 다시 시도해주세요.');
    console.error(e);
  } finally {
    btn.disabled = false;
    loading.classList.remove('visible');
  }
}

function showResults(r) {
  const prob = Math.round(r.icu_prob);
  const surgMin = Math.round(r.surgery_min);

  // 위험도
  const riskPct = document.getElementById('riskPct');
  const riskLabel = document.getElementById('riskLabel');
  const gaugeFill = document.getElementById('gaugeFill');

  riskPct.textContent = prob + '%';

  let riskClass, labelText, fillClass;
  if (prob < 20) {
    riskClass = 'risk-low'; labelText = '저위험 — ICU 입원 가능성 낮음'; fillClass = 'low';
  } else if (prob < 50) {
    riskClass = 'risk-mid'; labelText = '중위험 — 주의 관찰 필요'; fillClass = 'mid';
  } else {
    riskClass = 'risk-high'; labelText = '고위험 — ICU 준비 권고'; fillClass = 'high';
  }

  riskPct.className = 'metric-value ' + riskClass;
  riskLabel.textContent = labelText;
  gaugeFill.className = 'gauge-fill ' + fillClass;
  setTimeout(() => { gaugeFill.style.width = Math.min(prob, 100) + '%'; }, 100);

  // 수술 시간
  document.getElementById('surgeryTime').textContent = surgMin;
  const low = Math.round(surgMin * 0.8);
  const high = Math.round(surgMin * 1.2);
  document.getElementById('surgeryTimeRange').textContent = `예상 범위: ${low}~${high}분`;
  document.getElementById('tlEndLabel').textContent = surgMin + '분 후';
  document.getElementById('tlEnd').classList.add('active');

  // 요인 렌더링
  const badgeMap  = { high: 'badge-danger', mid: 'badge-warn', ok: 'badge-ok' };
  const badgeText = { high: '위험', mid: '주의', ok: '양호' };

  const makeFactorHtml = (factors) => factors.map(f =>
    `<div class="factor-item">
       <span class="factor-name">${f.name}</span>
       <span>
         <strong>${f.value}</strong>&nbsp;
         <span class="factor-badge ${badgeMap[f.impact]}">${badgeText[f.impact]}</span>
       </span>
     </div>`
  ).join('');

  document.getElementById('riskFactors').innerHTML = makeFactorHtml(r.risk_factors || []);
  document.getElementById('timeFactors').innerHTML = makeFactorHtml(r.time_factors || []);
  document.getElementById('recommendation').textContent = r.recommendation;

  // 결과 표시
  const resultsEl = document.getElementById('results');
  resultsEl.classList.add('visible');
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>

</body>
</html>
