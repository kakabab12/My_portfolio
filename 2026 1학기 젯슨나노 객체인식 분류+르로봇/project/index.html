<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로봇팔 작업 관리자</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00BFFF;
            --accent2: #7C4DFF;
            --bg: #13151a;
            --card: rgba(30, 34, 43, 0.85);
            --border: rgba(255,255,255,0.07);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            font-size: 0.88rem;
            min-height: 100vh;
        }
        .container-fluid { max-width: 1900px; }

        /* 카드 */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-top: 2px solid var(--accent);
            border-radius: 10px;
            backdrop-filter: blur(12px);
        }
        .card.cam2 { border-top-color: var(--accent2); }
        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.82rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .cam1-label { color: var(--accent); }
        .cam2-label { color: var(--accent2); }

        /* 타이틀 */
        .main-title {
            font-weight: 600;
            font-size: 1.4rem;
            color: #fff;
            letter-spacing: 0.04em;
        }
        .badge-cam {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
        }

        /* 카메라 피드 */
        .cam-feed {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 0 0 8px 8px;
            background: #000;
            display: block;
        }
        .cam-wrapper { position: relative; }
        .cam-status {
            position: absolute;
            top: 8px; left: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            background: rgba(0,0,0,0.6);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* 성능 바 */
        .progress { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; }
        .progress-bar { border-radius: 3px; transition: width 0.5s ease; }
        .bar1 { background: var(--accent); }
        .bar2 { background: var(--accent2); }
        .stat-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* 탭 */
        .nav-tabs { border-bottom: 1px solid var(--border); }
        .nav-tabs .nav-link {
            color: rgba(255,255,255,0.45);
            border: none;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }
        .nav-tabs .nav-link.active {
            color: #fff;
            background: transparent;
            border-bottom: 2px solid var(--accent);
        }
        .nav-tabs .nav-link.cam2-tab.active { border-bottom-color: var(--accent2); }

        /* 로그 테이블 */
        .log-wrap { height: 180px; overflow-y: auto; }
        .log-wrap::-webkit-scrollbar { width: 4px; }
        .log-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
        .table { font-size: 0.78rem; margin-bottom: 0; }
        .table th { color: rgba(255,255,255,0.4); font-weight: 500; text-align: center; border-bottom: 1px solid var(--border); }
        .table td { text-align: center; vertical-align: middle; border-color: var(--border); }

        /* 제어 버튼 */
        .btn-start { background: #1a7a4a; border: none; font-weight: 600; }
        .btn-start:hover { background: #22a060; }
        .btn-stop  { background: #7a1a1a; border: none; font-weight: 600; }
        .btn-stop:hover  { background: #a02222; }
        .btn-calib { background: rgba(255,255,255,0.07); border: 1px solid var(--border); font-size: 0.8rem; }
        .btn-calib:hover { background: rgba(255,255,255,0.12); }

        /* Claude 채팅 */
        #claude-chat {
            display: none;
            position: fixed;
            bottom: 90px; right: 20px;
            width: 380px;
            z-index: 999;
            border: 1px solid rgba(124,77,255,0.3) !important;
            border-top: 2px solid var(--accent2) !important;
        }
        #claude-content {
            height: 420px;
            overflow-y: auto;
            font-size: 0.82rem;
            background: var(--bg);
        }
        #claude-content::-webkit-scrollbar { width: 4px; }
        #claude-content::-webkit-scrollbar-thumb { background: var(--accent2); border-radius: 2px; }
        .chat-user {
            background: rgba(124,77,255,0.25);
            border-radius: 10px 10px 2px 10px;
            padding: 7px 12px;
            margin: 6px 0 6px 30px;
            color: #e8e0ff;
        }
        .chat-ai {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(124,77,255,0.2);
            border-radius: 10px 10px 10px 2px;
            padding: 7px 12px;
            margin: 6px 30px 6px 0;
            color: #e0e0e0;
            line-height: 1.5;
        }
        .fab {
            position: fixed;
            bottom: 20px; right: 20px;
            width: 56px; height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent2), #b040ff);
            border: none;
            cursor: pointer;
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(124,77,255,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .fab:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(124,77,255,0.6); }

        /* 구분선 */
        .divider { border-color: var(--border); margin: 10px 0; }
    </style>
</head>
<body>
<div class="container-fluid py-4">

    <!-- 헤더 -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h1 class="main-title mb-0">로봇팔 작업 관리자</h1>
        <div class="d-flex gap-2">
            <span class="badge badge-cam" style="background:rgba(0,191,255,0.15); color:var(--accent);">1CAM · RealSense</span>
            <span class="badge badge-cam" style="background:rgba(124,77,255,0.15); color:var(--accent2);">2CAM · DAISO WebCam</span>
        </div>
    </div>

    <div class="row g-3">

        <!-- ===== 카메라 1 (RealSense) ===== -->
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header d-flex align-items-center gap-2">
                    <span class="cam1-label">● 1번 캠</span>
                    <span class="text-white-50">RealSense D435</span>
                    <span class="ms-auto stat-val cam1-label" id="fps1">0.00</span>
                    <span class="text-white-50" style="font-size:0.7rem">FPS</span>
                </div>
                <div class="cam-wrapper">
                    <img id="feed1"
                         src="http://127.0.0.1:5000/video_feed/1"
                         class="cam-feed"
                         onerror="this.src='https://via.placeholder.com/640x480/0a0a0a/333?text=RealSense+Not+Connected'">
                    <span class="cam-status cam1-label">RealSense</span>
                </div>
            </div>
        </div>

        <!-- ===== 카메라 2 (IMX219) ===== -->
        <div class="col-lg-4">
            <div class="card cam2 h-100">
                <div class="card-header d-flex align-items-center gap-2">
                    <span class="cam2-label">● 2번 캠</span>
                    <span class="text-white-50">DAISO WebCam</span>
                    <span class="ms-auto stat-val cam2-label" id="fps2">0.00</span>
                    <span class="text-white-50" style="font-size:0.7rem">FPS</span>
                </div>
                <div class="cam-wrapper">
                    <img id="feed2"
                         src="http://127.0.0.1:5000/video_feed/2"
                         class="cam-feed"
                         onerror="this.src='https://via.placeholder.com/640x480/0a0a0a/333?text=IMX219+Not+Connected'">
                    <span class="cam-status cam2-label">DAISO WebCam</span>
                </div>
            </div>
        </div>

        <!-- ===== 오른쪽: 성능 + 제어 + 로그 ===== -->
        <div class="col-lg-4 d-flex flex-column gap-3">

            <!-- 시스템 성능 -->
            <div class="card">
                <div class="card-header">시스템 성능</div>
                <div class="card-body py-2">
                    <div class="d-flex justify-content-between mb-1">
                        <small class="text-white-50">CPU</small>
                        <small id="cpu-val" class="stat-val" style="color:var(--accent)">0%</small>
                    </div>
                    <div class="progress mb-2"><div class="progress-bar bar1" id="cpu-bar" style="width:0%"></div></div>
                    <div class="d-flex justify-content-between mb-1">
                        <small class="text-white-50">Memory</small>
                        <small id="mem-val" class="stat-val" style="color:var(--accent)">0%</small>
                    </div>
                    <div class="progress"><div class="progress-bar bar1" id="mem-bar" style="width:0%"></div></div>
                </div>
            </div>

            <!-- 아두이노 로봇 제어 -->
            <div class="card">
                <div class="card-header d-flex align-items-center gap-2">
                    <span style="color:#f59e0b;">⚙</span>
                    <span>아두이노 로봇 제어</span>
                    <span class="ms-auto" style="font-size:0.7rem; color:rgba(255,255,255,0.3); font-family:'JetBrains Mono',monospace;">Arduino</span>
                </div>
                <div class="card-body py-2">
                    <div class="d-flex gap-2 mb-2">
                        <button class="btn btn-start flex-grow-1 py-2" onclick="sendCommand('START')">▶ START</button>
                        <button class="btn btn-stop  flex-grow-1 py-2" onclick="sendCommand('STOP')">■ STOP</button>
                    </div>
                    <button class="btn btn-calib w-100 text-white py-1" onclick="sendCommand('CALIB')">⟳ CALIBRATION</button>
                    <div class="text-center mt-2">
                        <small class="text-white-50">상태: <span id="cmd-status" class="text-white fw-bold">대기 중</span></small>
                    </div>
                </div>
            </div>

            <!-- 로그: 1캠/2캠 상위탭 → 탐지/동작 하위탭 -->
            <div class="card flex-grow-1">
                <div class="card-header p-0">
                    <!-- 상위 탭: 1캠 / 2캠 -->
                    <ul class="nav nav-tabs border-0 px-2 pt-1" id="camTabs">
                        <li class="nav-item">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#cam1-pane">
                                <span class="cam1-label">●</span> 1캠 · RealSense
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link cam2-tab" data-bs-toggle="tab" data-bs-target="#cam2-pane">
                                <span class="cam2-label">●</span> 2캠 · DAISO WebCam
                            </button>
                        </li>
                    </ul>
                </div>
                <div class="card-body p-0 tab-content">

                    <!-- 1캠 패널 -->
                    <div class="tab-pane fade show active" id="cam1-pane">
                        <!-- 하위 탭: 탐지 / 동작 -->
                        <ul class="nav nav-tabs border-0 px-3 pt-2" style="background:rgba(0,191,255,0.04);">
                            <li class="nav-item">
                                <button class="nav-link active" style="font-size:0.74rem; color:rgba(255,255,255,0.5);"
                                        data-bs-toggle="tab" data-bs-target="#det1">탐지 내역</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" style="font-size:0.74rem; color:rgba(255,255,255,0.5);"
                                        data-bs-toggle="tab" data-bs-target="#act1">동작 내역</button>
                            </li>
                        </ul>
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="det1">
                                <div class="log-wrap">
                                    <table class="table table-dark table-sm">
                                        <thead><tr><th>인식 숫자</th><th>정확도</th></tr></thead>
                                        <tbody id="det1-body"></tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="act1">
                                <div class="log-wrap">
                                    <table class="table table-dark table-sm">
                                        <thead><tr><th>동작</th><th>결과</th></tr></thead>
                                        <tbody id="act1-body"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 2캠 패널 -->
                    <div class="tab-pane fade" id="cam2-pane">
                        <!-- 하위 탭: 탐지 / 동작 -->
                        <ul class="nav nav-tabs border-0 px-3 pt-2" style="background:rgba(124,77,255,0.04);">
                            <li class="nav-item">
                                <button class="nav-link active" style="font-size:0.74rem; color:rgba(255,255,255,0.5);"
                                        data-bs-toggle="tab" data-bs-target="#det2">탐지 내역</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" style="font-size:0.74rem; color:rgba(255,255,255,0.5);"
                                        data-bs-toggle="tab" data-bs-target="#act2">동작 내역</button>
                            </li>
                        </ul>
                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="det2">
                                <div class="log-wrap">
                                    <table class="table table-dark table-sm">
                                        <thead><tr><th>인식 숫자</th><th>정확도</th></tr></thead>
                                        <tbody id="det2-body"></tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="act2">
                                <div class="log-wrap">
                                    <table class="table table-dark table-sm">
                                        <thead><tr><th>동작</th><th>결과</th></tr></thead>
                                        <tbody id="act2-body"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <footer class="mt-4 text-center" style="color:rgba(255,255,255,0.2); font-size:0.75rem;">
        김한민 · 이지용 · 장민기 
    </footer>
</div>

<!-- Claude AI 채팅 -->
<div id="claude-chat" class="card">
    <div class="card-header d-flex align-items-center justify-content-between px-3 py-2"
         style="background:rgba(124,77,255,0.08);">
        <div class="d-flex align-items-center gap-2">
            <svg width="20" height="20" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g transform="translate(50,50)">
                    <rect x="-7" y="-48" width="14" height="36" rx="7" fill="#c4b5fd" transform="rotate(0)"/>
                    <rect x="-7" y="-48" width="14" height="36" rx="7" fill="#c4b5fd" transform="rotate(30)"/>
                    <rect x="-7" y="-48" width="14" height="36" rx="7" fill="#c4b5fd" transform="rotate(60)"/>
                    <rect x="-7" y="-48" width="14" height="36" rx="7" fill="#c4b5fd" transform="rotate(90)"/>
                    <rect x="-7" y="-48" width="14" height="36" rx="7" fill="#c4b5fd" transform="rotate(120)"/>
                    <rect x="-7" y="-48" width="14" height="36" rx="7" fill="#c4b5fd" transform="rotate(150)"/>
                    <rect x="-7" y="-48" width="14" height="36" rx="7" fill="#c4b5fd" transform="rotate(180)"/>
                    <rect x="-7" y="-48" width="14" height="36" rx="7" fill="#c4b5fd" transform="rotate(210)"/>
                    <rect x="-7" y="-48" width="14" height="36" rx="7" fill="#c4b5fd" transform="rotate(240)"/>
                    <rect x="-7" y="-48" width="14" height="36" rx="7" fill="#c4b5fd" transform="rotate(270)"/>
                    <rect x="-7" y="-48" width="14" height="36" rx="7" fill="#c4b5fd" transform="rotate(300)"/>
                    <rect x="-7" y="-48" width="14" height="36" rx="7" fill="#c4b5fd" transform="rotate(330)"/>
                </g>
            </svg>
            <span style="font-weight:600; color:#c4b5fd; font-size:0.9rem;">Claude AI 분석</span>
        </div>
        <button class="btn-close btn-close-white btn-sm" onclick="toggleClaude()"></button>
    </div>
    <div id="claude-content" class="p-3">
        <div class="chat-ai">안녕하세요! 공정 데이터를 바탕으로 분석해 드립니다.</div>
    </div>
    <div class="card-footer p-2" style="background:var(--card);">
        <div class="input-group input-group-sm">
            <input type="text" id="claude-input"
                   class="form-control bg-dark text-white border-secondary"
                   placeholder="예: 현재 공정 상태 분석해줘"
                   onkeypress="if(event.keyCode==13) askClaude()">
            <button class="btn btn-sm text-white" style="background:var(--accent2);" onclick="askClaude()">전송</button>
        </div>
    </div>
</div>

<!-- FAB 버튼 -->
<button class="fab" onclick="toggleClaude()">
    <svg width="26" height="26" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(50,50)">
            <rect x="-7" y="-48" width="14" height="36" rx="7" fill="white" transform="rotate(0)"/>
            <rect x="-7" y="-48" width="14" height="36" rx="7" fill="white" transform="rotate(30)"/>
            <rect x="-7" y="-48" width="14" height="36" rx="7" fill="white" transform="rotate(60)"/>
            <rect x="-7" y="-48" width="14" height="36" rx="7" fill="white" transform="rotate(90)"/>
            <rect x="-7" y="-48" width="14" height="36" rx="7" fill="white" transform="rotate(120)"/>
            <rect x="-7" y="-48" width="14" height="36" rx="7" fill="white" transform="rotate(150)"/>
            <rect x="-7" y="-48" width="14" height="36" rx="7" fill="white" transform="rotate(180)"/>
            <rect x="-7" y="-48" width="14" height="36" rx="7" fill="white" transform="rotate(210)"/>
            <rect x="-7" y="-48" width="14" height="36" rx="7" fill="white" transform="rotate(240)"/>
            <rect x="-7" y="-48" width="14" height="36" rx="7" fill="white" transform="rotate(270)"/>
            <rect x="-7" y="-48" width="14" height="36" rx="7" fill="white" transform="rotate(300)"/>
            <rect x="-7" y="-48" width="14" height="36" rx="7" fill="white" transform="rotate(330)"/>
        </g>
    </svg>
</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const SERVER = "http://127.0.0.1:5000";

// ── 시스템 제어 ──
function sendCommand(cmd) {
    const el = document.getElementById('cmd-status');
    el.textContent = cmd + ' 전송 중...';
    fetch(`${SERVER}/control`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({command: cmd})
    })
    .then(r => r.json())
    .then(d => { el.textContent = d.status === 'success' ? d.command : '전송 실패'; })
    .catch(() => { el.textContent = '연결 오류'; });
}

// ── 데이터 갱신 ──
function updateData() {
    fetch(`${SERVER}/data`)
    .then(r => r.json())
    .then(d => {
        const s = d.stats;

        // 성능
        document.getElementById('cpu-bar').style.width = s.cpu + '%';
        document.getElementById('cpu-val').textContent = s.cpu.toFixed(1) + '%';
        document.getElementById('mem-bar').style.width = s.memory + '%';
        document.getElementById('mem-val').textContent = s.memory.toFixed(1) + '%';

        // FPS (카메라별)
        document.getElementById('fps1').textContent = (s.fps1 || s.fps || 0).toFixed(2);
        document.getElementById('fps2').textContent = (s.fps2 || 0).toFixed(2);

        // 로그 렌더링
        renderLog('det1-body', d.detection_log_1 || [], ['class','conf']);
        renderLog('act1-body', d.action_log_1    || [], ['action','result']);
        renderLog('det2-body', d.detection_log_2 || [], ['class','conf']);
        renderLog('act2-body', d.action_log_2    || [], ['action','result']);
    })
    .catch(e => console.error('data fetch error:', e));
}

function renderLog(tbodyId, logs, keys) {
    if (!logs.length) return;
    document.getElementById(tbodyId).innerHTML =
        logs.slice(-50).reverse().map(l =>
            `<tr>${keys.map(k => `<td>${l[k] ?? ''}</td>`).join('')}</tr>`
        ).join('');
}

// ── Claude AI ──
function toggleClaude() {
    const el = document.getElementById('claude-chat');
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function askClaude() {
    const input   = document.getElementById('claude-input');
    const content = document.getElementById('claude-content');
    const q = input.value.trim();
    if (!q) return;

    content.innerHTML += `<div class="chat-user">${q}</div>`;
    input.value = '';
    content.scrollTop = content.scrollHeight;

    const loadId = 'load-' + Date.now();
    content.innerHTML += `<div id="${loadId}" class="chat-ai" style="color:rgba(255,255,255,0.3)">분석 중...</div>`;

    try {
        const res  = await fetch(`${SERVER}/ask_claude`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                prompt: q,
                context: {
                    cpu: document.getElementById('cpu-val').textContent,
                    fps1: document.getElementById('fps1').textContent,
                    fps2: document.getElementById('fps2').textContent
                }
            })
        });
        const data = await res.json();
        document.getElementById(loadId).remove();
        content.innerHTML += `<div class="chat-ai">${data.answer}</div>`;
    } catch {
        document.getElementById(loadId).textContent = '서버 응답 없음';
    }
    content.scrollTop = content.scrollHeight;
}

setInterval(updateData, 2000);
document.addEventListener('DOMContentLoaded', updateData);
</script>
</body>
</html>
