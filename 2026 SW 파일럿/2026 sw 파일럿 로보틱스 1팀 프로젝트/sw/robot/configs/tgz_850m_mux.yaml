teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: false
    enable_button: 4
    enable_turbo_button: -1
    axis_linear:
      x: 1
    scale_linear:
      # 실제 컨트롤러 기준: 스틱 위가 양수 전진, 아래가 음수 후진.
      x: 0.08
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.6
    inverted_reverse: true
    publish_stamped_twist: false
