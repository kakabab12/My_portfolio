# gesture_kiosk 설정 — 모든 튜닝값의 단일 출처 (기획서 4.7 : 코드에 숫자 하드코딩 금지)
#
# 2026-07-10 전면 개편 — 타깃: 윈도우 + Python 3.11.5 (정부 민원발급기)
# 2026-07-24 win 통합판(feat/think_win): 구 win_cpu/win_gpu 브랜치 통합 —
#   NVIDIA GPU가 있으면 CUDA로, 없으면 CPU로 자동 실행 (device/pose_mode: auto)
# 2026-07-29 포즈 스택 제거(사용자 결정): 추론 = MediaPipe HandLandmarker 단독
#   (TFLite/XNNPACK, Apache-2.0). 포즈가 하던 잠금·자·게이트는 hand_select가
#   손 기반으로 대체 — 한 명 사용 가정. onnxruntime·rtmlib·GPU 스택 소멸
# 2026-07-28 손 모델 교체: 손 판별을 MediaPipe HandLandmarker(hand_tracker 섹션)로
# 2026-07-29 동작 체계 개편(사용자 결정 — 상하 포커스 제거, 위=select, ok→confirm):
#   한 손가락 + 좌/우/위 = left/right/select (포커스 이동 — 탐색 계층)
#   주먹 + 왼쪽/위/오른쪽 = back(이전) / home(처음으로) / confirm(확인) — 명령 계층
#   아래 방향 = 정의 없음(두 모양 공통 — top/bottom 소멸).
#   손 모양이 계층을, 이동 방향이 기능을 정한다 — 반복 횟수·화면 좌표 안 씀.
#   (07-23 체계: left/right/top/bottom/back/home/ok — 07-29 위와 같이 개편)
# 2026-08-05 꺾임 판(feat/hand_bend, 사용자 결정): 판정을 이동(쓸기)에서
#   **자세(손 꺾임)**로 전면 교체 — 펼친 손의 팔 대비 꺾임 방향이 곧 명령이다
#   (hand_bend 섹션 주석 참고. 쓸기·로터 이벤트는 이 판에서 파이프로 안 나간다)

camera:
  model: "Logitech Brio 100"  # 사용 카메라 기종 기록(2026-07-16 신설) — 실측 검증 2026-07-10.
                              #   ★2026-08-04 고지(사용자): 본 개발은 **IR 카메라로
                              #   변경**된다. 이 파일의 임계값은 전부 광학(RGB)
                              #   실측이므로, 교체 시 재보정·재확인이 필요하다
                              #   — 항목은 docs/TODO.md "IR 카메라 전환 시 전면 재확인"
                              #   OpenCV는 장치 이름을 못 읽으므로 사람이 기록. 교체 시 갱신 —
                              #   시작 로그의 "카메라 협상 결과"에 협상값과 나란히 남는다
  device_id: 0            # USB 웹캠 장치 번호
  exposure:               # 노출·게인 수동 설정(2026-08-07 신설, 사용자 제안 —
                          #   "물류창고 PDA 카메라 같은 필터"). 바코드 스캐너가
                          #   어두운 창고에서 가까운 것만 정확히 읽는 건 알고리즘이
                          #   아니라 **광학**이다: 자기 조명 + 짧은 노출이면 빛이
                          #   1/d²로 감쇠해 **가까운 피사체만 밝고 먼 배경은 검게
                          #   떨어진다**. 뒷사람 문제를 이미지 단계에서 없애는
                          #   방법 — 안 찍힌 사람은 검출될 수 없다.
                          #   ★지금(실내 조명·RGB 웹캠)은 효과가 제한적이라
                          #   기본 꺼짐: 실내광이 균일하면 뒷사람도 같이 밝다.
                          #   값을 하는 조건은 **조명이 카메라 쪽에 있을 때** —
                          #   키오스크 전면 조명, 그리고 무엇보다 예정된
                          #   **IR 카메라 전환**(docs/TODO.md)이다. IR은 조명이
                          #   장치에 딸려오므로 위 감쇠가 그대로 성립한다.
                          #   전환하면 manual: true로 켜고 exposure_value를
                          #   내려가며 뒷사람이 어두워지는 지점을 찾을 것.
                          #   덤: 짧은 노출은 **모션 블러도 없앤다** — 손끝
                          #   세그멘테이션 신뢰도 저하(isolate_anchor_blur
                          #   mask_dilate_px 주석)의 원인 중 하나가 그것이다
                          #   ★2026-08-07 실측(사용자 질문 — "RGB 카메라 기준으로
                          #   안되나"): 현재 장비(Brio 100)에서는 **두 가지 이유로
                          #   안 된다**. 켜기 전에 이 둘부터 해결해야 한다.
                          #   ①노출 설정이 실제로 안 먹는다 — exposure를 -4~-10
                          #     으로 훑어도 화면 평균 밝기가 136.0/136.4/136.3/
                          #     136.2/136.2로 **사실상 불변**이었다. cap.set()은
                          #     True를 돌려주고 읽기값도 바뀌지만(DSHOW -8,
                          #     MSMF -6으로 클램프) 이미지에는 반영되지 않는다.
                          #   ②설령 먹어도 **방향이 반대**다 — 같은 실측에서
                          #     근경(사용자) 136 / 원경(배경) 163 = **0.83**,
                          #     즉 배경이 사용자보다 밝다(뒤에 창문 — 역광).
                          #     노출을 낮추면 뒷사람보다 **사용자가 먼저 죽는다**.
                          #   → 이 기능이 값을 하려면 IR이냐 RGB냐가 아니라
                          #     **광원이 카메라 쪽에 있느냐**가 조건이다. RGB로도
                          #     된다 — 키오스크 전면 조명 + 역광 안 지는 배치 +
                          #     노출이 먹는 카메라. IR을 쓰는 이유는 물리가 달라서가
                          #     아니라 조명이 눈에 안 보여서다.
                          #   ※그동안의 "먼 사람 제거"는 이것 없이도 되고 있다 —
                          #     head_anchor의 깊이 관문(depth_reject_ratio)이
                          #     같은 일을 계산으로 한다(실측 분리 0.78 vs 1.07)
    manual: false         # true면 자동 노출을 끄고 아래 값을 적용
    exposure_value: -7    # OpenCV 노출값(백엔드마다 단위가 다르다 — DSHOW는
                          #   대체로 2^n초라 -7 ≈ 1/128초). 낮출수록 어둡고
                          #   먼 배경이 빨리 죽는다. 실측 전 초안값
    gain: 0               # 게인(증폭). 올리면 먼 것도 같이 살아나 취지가
                          #   무너진다 — 0 유지 권장
    auto_exposure_off_value: 0.25  # 자동 노출 끄기 값 — DSHOW 관습(0.25=수동,
                          #   0.75=자동). 백엔드·장치마다 달라 config로 뺐다.
                          #   설정이 먹었는지는 시작 로그 "노출 수동 설정"에서
                          #   요청값과 실제값을 나란히 확인할 것
  width_px: 1280          # ★FHD(1920x1080) 검토(2026-08-03 사용자 제안): ROI 줌을
  height_px: 720          #   넣은 뒤로는 해상도가 **원거리 인식에 실제로 도움**이 된다 —
                          #   크롭이 원본 픽셀 그대로 모델에 들어가므로 같은 크롭이 더
                          #   선명해진다(줌 도입 전에는 검출기가 프레임 전체를 ~192px로
                          #   줄여봐서 무의미했다. 그때 결론을 이 항목에 한해 정정한다).
                          #   개발 PC 실측: HD 80 FPS / FHD 53 FPS (손 없는 상태 — 손이
                          #   잡히면 둘 다 더 내려간다). 키오스크 CPU는 더 느리므로
                          #   **올리기 전에 반드시** `py scripts\benchmark.py`로 30 FPS를
                          #   확인할 것. 임계값은 어깨너비 정규화라 해상도를 바꿔도
                          #   재보정이 필요 없다.
  mirror: true            # 거울 모드 — 사용자 기준 좌/우와 쓸기 방향을 일치시킨다
  windows_backend: msmf   # 윈도우 캡처 백엔드: msmf | dshow | auto
                          #   Brio 100 실측(2026-07-10): dshow는 YUY2 720p로만 협상돼 ~5 FPS,
                          #   msmf는 30 FPS. 오픈이 수십 초 걸리는 장치면 dshow로 되돌릴 것
  fourcc: mjpg            # 캡처 픽셀 포맷 — 무압축(YUY2) 720p는 USB 한계로 ~5 FPS. auto면 미설정
                          #   (msmf는 이 설정을 무시하기도 한다 — dshow 계열 카메라용)
  recovery_timeout_sec: 3.0  # 런타임 자동 복구(2026-07-28) — 프레임이 이 시간 동안 안 오면
                          #   끊김(USB 탈락·드라이버 멈춤)으로 보고 장치를 닫고 재연결을
                          #   반복한다. 무인 키오스크에서 조용한 정지 방지 — 복구 중에도
                          #   파이프라인은 마지막 프레임으로 생존. 키 없어도 기본값으로 켜짐
  recovery_retry_sec: 2.0 # 재연결 시도 간격 — 너무 짧으면 드라이버 초기화 중에 계속 실패
  auto_select:            # A안(2026-07-28) — 시작 시 카메라 프로브: 웹캠 2대 구성(№12)에서
                          #   손 인식 품질이 가장 높은 장치를 메인으로 자동 선택.
                          #   (2026-07-29 포즈 제거 — 얼굴 감지율 항목 소멸: 손 품질 단독)
                          #   장치 열거 순서가 바뀌어도 올바른 카메라가 잡히고, IR 카메라 등
                          #   인식 불가 장치는 자동 탈락. ★프로브 순간 카메라 앞에서 손을
                          #   보여야 유효 — 전 장치 0점이면 위 device_id 폴백 (camera_probe.py)
    enabled: false  # 2026-08-03 배포 기본 off(사용자 결정 — 카메라 1대 확정):
                    #   프로브 생략 = 시작 즉시 + 장치 열거 지연·오픈 행 위험 제거.
                    #   카메라 2대 구성으로 바뀌면 true로 (손 품질 자동 선별)
    probe_device_count: 4 # 장치 번호 0..N-1 시도 — 없는 번호는 열기 실패로 건너뜀
    warmup_frames: 5      # 장치당 버리는 초기 프레임 (자동 노출 안정화)
    probe_frames: 15      # 장치당 채점 프레임 — 30 FPS 기준 0.5초 (시작 지연과 트레이드오프)
    probe_timeout_sec: 3.0  # 장치당 시간 한도 — MSMF는 오픈 직후 read 실패가 흔해
                          #   (2026-07-28 실기) 성공 프레임 기준으로 세되 이 시간에 자른다
    probe_open_timeout_sec: 15.0  # 장치 **오픈** 한도(2026-07-31 키오스크 실기 — 엔진
                          #   먹통): MSMF는 오픈 자체가 장치에 따라 무한 대기한다 —
                          #   장치 1 오픈에서 프로브가 통째로 멈췄다. 정상 장치(Brio)도
                          #   이 PC에서 오픈 ~11초 실측이라 그보다 여유 있게 15초.
                          #   초과 장치는 건너뛴다(콘솔 경고). 오픈이 느린 정상 카메라가
                          #   자꾸 제외되면 ↑
    good_hand_span_ratio: 0.10  # 손 크기 만점 기준 — 손 랜드마크 폭이 프레임 폭의 이
                          #   비율이면 크기 점수 1.0 (2026-07-29 품질 채점: 이진 감지는
                          #   앉은 사용자에서 위·아래 카메라가 동점 — 손이 크게 보이는
                          #   구도 좋은 카메라가 이기도록 크기×신뢰도로 채점)

model:                    # 추론 루프 설정 — 2026-07-29 포즈 스택 제거(사용자 결정)로
                          #   포즈 키(pose_engine·device·pose_mode·det_interval 등)는
                          #   전부 소멸. 추론 모델은 hand_tracker(MediaPipe) 하나다
  max_infer_fps: 60       # 추론 루프 FPS 상한 — 초과분은 대기.
                          #   ★주의: 2026-07-10 실측 — CPU 추론 루프가 60으로 돌 때 캡처
                          #   스레드의 CPU/GIL을 빼앗아 캡처 FPS 반토막 → 인식 저하 시 30으로
  idle_infer_fps: 10      # 유휴(손 없음) 시 추론 FPS — 키오스크 대기 시간의
                          #   CPU·전력 절감 (2026-07-20). 손이 보이면 즉시 max로 복귀

hand_tracker:             # 손 랜드마크 — MediaPipe HandLandmarker (2026-07-28 도입,
                          #   Apache-2.0). 보이는 손만 보고(유령 손 없음) + 좌/우 내장
                          #   + z(깊이) 제공 — 판별 임계는 person_lock.hand_shape
  model_path: models/weights/hand_landmarker.task  # download_weights.py가 받는다
                          #   (mediapipe 1.0은 모델을 wheel에 담지 않음 — 오프라인
                          #   번들은 이 파일을 그대로 복사하면 된다)
  max_num_hands: 4        # 프레임 전체 손 상한 — 옆 사람 손은 person_lock의 도달
                          #   거리 게이트가 거른다. 키오스크 앞 2명(4손) 가정
  min_detection_conf: 0.4 # 손바닥 검출 최소 신뢰도 — 낮추면 원거리 손을 더 잡지만 오검출↑.
                          #   2026-07-28 실기: 멀어지면 인식 저하 — 0.5→0.4 (오검출은
                          #   person_lock 도달 거리 게이트가 2차 방어)
  min_presence_conf: 0.4  # 추적 유지 중 손 존재 신뢰도 — 미달이면 재검출로 복귀
  min_tracking_conf: 0.4  # 프레임 간 추적 신뢰도 — 미달이면 재검출 (블러·빠른 이동)
  roi_zoom:               # 원거리 디지털 줌(2026-07-31 실기 — 거리별 인식 편차: 멀면
                          #   좌/우 쓸기 저하·주먹/한 손가락 구분 불가): 손바닥 검출기는
                          #   프레임 전체를 고정 크기(~192px)로 줄여 봐서, 먼 손은 캡처
                          #   해상도와 무관하게 몇 픽셀로 뭉개진다. 앵커(머리) 주변 팔
                          #   도달 반경만 잘라 손 추론에 넣어 손을 모델 입력에서 키운다
                          #   — 해상도 인상(USB 대역·FPS 비용)과 달리 비용이 거의 없다.
                          #   앵커 부재·근거리(크롭≈프레임)면 자동으로 전체 프레임.
                          #   키(roi_zoom) 삭제 시 종전(항상 전체 프레임)
    pad_reach_ratio: 1.3  # 크롭 반변 = 팔 도달 반경(hand_select.anchor_reach_px) × N —
                          #   반경 밖 면제 획(쓸기 끝점)까지 담는 여유. 획 끝이 잘리면 ↑
    min_side_px: 320      # 크롭 최소 한 변 — 초원거리에서 크롭이 지나치게 작아지는 것 방지
    move_ratio: 0.15      # 재중심 문턱 — 크롭 중심이 변(邊)의 이 비율 이상 움직일 때만
                          #   창 이동: 매 프레임 옮기면 VIDEO 모드 추적 ROI가 어긋나
                          #   재검출이 반복된다 (히스테리시스)
    resize_ratio: 0.2     # 크기 갱신 문턱 — 변이 이 비율 이상 변할 때만 창 크기 변경

  isolate_anchor_blur:     # 인식 대상 외 블러(2026-08-07 신설·실험적, 사용자 제안 —
                          #   "인식되는 사람 제외하고 모든 것을 블러 처리"): 앵커
                          #   사람 주변만 남기고 나머지를 흐려서, 손 모델이 다른
                          #   사람의 손을 아예 못 보게 만든다. roi_zoom(팔 도달
                          #   반경 — 넉넉함)과 별개로, 이건 인접한 사람을 배제하려고
                          #   **더 좁게** 잡는 반경이다.
                          #   ★2026-08-07 2차(사용자 결정 — "블러를 사람 누끼 딴거
                          #   제외하고"): head_anchor.output_segmentation_masks가
                          #   켜져 있고 마스크가 관측되면 **실루엣 기준**(픽셀
                          #   단위, preprocessor.blur_outside_mask)으로 정밀하게
                          #   자른다 — 바로 옆에 붙어 앉은 사람도 실루엣 밖이면
                          #   블러된다. 마스크가 없으면(비활성·추출 실패) 아래
                          #   정사각형(anchor_keep_sharp_box·
                          #   keep_sharp_shoulder_widths) 폴백 — 옆 사람과 분리는
                          #   안 되지만 항상 동작한다.
                          #   ⚠실기 미검증 — 두 가지 위험을 먼저 인지할 것:
                          #   ①이미 낮게 실측된 FPS(3.7~7.0)에 프레임마다 블러
                          #   (+마스크 산출) 연산이 더해진다 ②"누가 앵커인가"
                          #   판정 자체가 아직 흔들리는 상태라(docs/TODO.md 9차)
                          #   앵커가 잘못된 순간에 켜져 있으면 오히려 진짜
                          #   사용자를 블러해 완전히 놓칠 수 있다. 포즈(머리)
                          #   추론에는 적용 안 함(realtime_loop 주석 — 자기강화
                          #   오류 방지)
    enabled: true          # ★2026-08-07 **다시 켬**(사용자 요청). 같은 날 껐다가
                          #   되돌린 것이라 경위를 남긴다 — 끌 때의 판단이
                          #   **틀렸다**.
                          #   끈 이유의 핵심은 "2인 상황에서 앵커 마스크가 화면의
                          #   38~55%를 덮으니 마스크 품질이 신뢰 불가"였다.
                          #   그런데 마스크를 **실제로 시각화해 보니**(같은 날,
                          #   logs/mask_view.png) 머리·어깨 윤곽이 정확한
                          #   **깨끗한 단일 실루엣**이었다 — 연결 덩어리 1개,
                          #   노이즈 없음. 덮는 비율이 큰 것은 마스크가 망가져서가
                          #   아니라 **사람이 카메라에 가까워 실제로 화면을 그만큼
                          #   차지하기 때문**이었다(같은 사람이 멀어지면 13.2%).
                          #   비율 숫자만 보고 품질을 단정한 오판이었다.
                          #   ※교훈: 이미지 문제는 이미지를 봐야 한다. 통계값만으로
                          #     "품질이 나쁘다"를 결론내지 말 것
                          #   다시 켜면서 안전장치 3겹을 함께 넣었다(아래 항목):
                          #     ①연결 성분 — 앵커 몸과 안 이어진 덩어리 제거
                          #     ②타인 실루엣 빼기(exclude_mask)
                          #     ③1인 제한 상자(mask_bound_shoulder_widths)
                          #   ★비용(2026-08-07 실측·최적화 후): 블러 경로 전체가
                          #     프레임당 **9.7ms**다. 되살릴 때 처음 잰 값은
                          #     58.0ms였는데, 절반 이상이 bool 배열 fancy
                          #     indexing(blurred[keep] = frame[keep]) 한 줄이었다
                          #     — 720p 2.7M 화소에서 그 방식은 매우 느리다.
                          #     전 과정을 uint8 + cv2 연산(copyTo·subtract·
                          #     슬라이싱)으로 바꿔 6배 줄였다.
                          #     그래도 공짜는 아니다 — FPS가 문제되면 여기부터
                          #     끌 것. 조작권 방어 자체는 블러 없이도 깊이
                          #     관문이 담당한다(그쪽이 본체, 블러는 보조)
    keep_sharp_shoulder_widths: 1.6  # 선명하게 남길 정사각형 한 변 = 어깨너비 × N
                          #   (중심은 앵커 중심). ★마스크 폴백 시에만 쓰인다 —
                          #   마스크가 있으면 이 값은 안 쓰인다(위 문단). 실기
                          #   미측정 초안 — 옆 사람이 여전히 살아남으면 ↓,
                          #   내 뻗은 손이 블러에 잘리면 ↑
    mask_threshold: 0.5    # 실루엣 마스크 판정 임계(0~1) — 이 값 이상인 픽셀만
                          #   "이 사람"으로 보고 선명하게 남긴다(마스크 있을
                          #   때만 쓰임 — 위 문단). 2026-08-07 신설, 실기 미측정
                          #   초안. 내 손끝·팔 가장자리가 블러에 잘리면
                          #   ↓(더 관대하게), 옆 사람 윤곽이 살짝 새 보이면 ↑
    # ★연결 성분 1인 보장(2026-08-07 — preprocessor.keep_component_at):
    #   앵커 중심에서 **픽셀이 이어지는 덩어리 하나만** 남긴다. 마스크가
    #   오작동해 뒷사람까지 덮더라도 화면에서 떨어져 있으면 덩어리가 갈리므로
    #   그쪽은 통째로 빠진다. 임계값이 아니라 **위상(연결성)**에 기대는 방어라
    #   조명·체형·거리에 안 흔들린다. 설정 항목 없음(항상 적용).
    #   비용: 연결성 판정만 **절반 해상도**에서 하고 최종적으로 원본 마스크와
    #   AND 해 경계 정밀도는 그대로 둔다(연결성은 저해상도에서도 보존 —
    #   팔 40px면 20px라 안 끊긴다. 1/4까지 줄이면 손목이 끊겨 사용자 손이
    #   잘릴 위험이 있어 1/2까지만).
    #   한계: 두 사람이 화면에서 맞닿으면 한 덩어리가 되어 못 가른다 —
    #   그 경우는 아래 exclude(타인 실루엣 빼기)와 깊이 관문이 받는다
    mask_bound_shoulder_widths: 3.6  # **1인 제한 상자** — 마스크 경로의 선명
                          #   영역이 이 정사각형(한 변 = 어깨너비 × N, 중심은
                          #   앵커)을 넘지 못한다. 2026-08-07 신설(사용자 지적 —
                          #   "블러 사람 한명만 인식하게해줘 리미트가
                          #   설정안되있는거같은데").
                          #   실측(합성 2인 프레임, 같은 날): 마스크는 사람별로
                          #   잘 갈린다 — 마스크0 = 오른쪽 20.4%/왼쪽 1.5%,
                          #   마스크1 = 왼쪽 15.5%/오른쪽 1.7%. 다만 상대편으로
                          #   **~7% 유출**이 있고 mask_dilate_px가 그 유출을
                          #   더 키운다. 이 상자가 그 유출의 상한이 된다 —
                          #   정밀도는 마스크가, 범위 한계는 상자가 맡는 이중 구조.
                          #   ★위 keep_sharp_shoulder_widths(1.6)와 **역할이
                          #   반대**라 값이 다르다: 그건 마스크가 없을 때 쓰는
                          #   폴백이라 **좁아야** 옆 사람을 덜 담고, 이건 마스크가
                          #   정밀도를 맡으니 **내 팔 도달을 다 담을 만큼
                          #   넉넉해야** 뻗은 손이 안 잘린다. 3.6 = 반변 1.8 =
                          #   head_anchor.reach_shoulder_widths와 같은 도달 반경.
                          #   내 뻗은 손이 블러에 잘리면 ↑, 옆 사람이 이 상자
                          #   안에서 살아남으면 ↓
    arm_reach_shoulder_widths: 0.9  # **옆 사람 차단** — 앵커의 팔 관절(어깨·
                          #   팔꿈치·손목·중심)에서 어깨너비 × N 안만 선명하게
                          #   남긴다. 2026-08-07 신설(사용자 보고 — "옆에
                          #   사람있으니까 블러 처리됐다가 손은 보이던데").
                          #   ★옆 사람은 뒷사람과 기하가 **정반대**라 오늘 만든
                          #   깊이 관문이 원리적으로 안 듣는다 — 옆에 서면
                          #   카메라와의 거리가 거의 같기 때문이다. 사각형
                          #   (mask_bound_shoulder_widths)으로도 못 가른다:
                          #   내 팔 도달을 다 담으려면 한 변이 어깨너비 3.6배는
                          #   돼야 하는데 그 안에 옆 사람이 통째로 들어온다.
                          #   해법은 이 코드베이스가 손 판정에서 이미 쓴 것과
                          #   같다(2026-08-03 손목 반경 도입 근거) —
                          #   **판정 영역이 내 팔을 따라다니게** 하면 팔을
                          #   내렸을 때 옆 사람 자리를 안 덮는다.
                          #   블러의 유일한 소비자가 손 모델이라(포즈는 블러 안 된
                          #   프레임을 따로 본다) 몸통 전체를 남길 이유가 없다.
                          #   값 근거: 손목에서 손끝까지가 어깨너비의 약 0.4배라
                          #   0.9면 두 배 이상 여유. 실측 전 초안이다.
                          #   ⚠손목 관측을 못 믿으면(가시성·팔 길이 관문 탈락)
                          #     이 제약은 **자동으로 꺼진다** — 엉뚱한 곳을
                          #     선명하게 두느니 방어를 거르는 쪽(인식 우선).
                          #   ※**혼자 있을 때도 꺼진다**(다른 사람 실루엣이
                          #     관측되지 않은 프레임): 배제할 대상이 없어 얻는
                          #     것이 없는데 손목 추정이 틀리면 내 손만 잘린다.
                          #     비용도 아낀다 — 실측 15.3 -> 9.7ms
                          #   내 손이 블러에 잘리면 ↑, 옆 사람 손이 남으면 ↓.
                          #   0이면 이 제약 없음(종전 동작)
    hand_box_reach_ratio: 1.4  # **관절 반경의 사각지대 보강** — ★2026-08-07
                          #   4차 신설(사용자 보고 — "제스처를 해도 블러 때문에
                          #   초록색 관절값이 사라지는 현상이 있네").
                          #   위 arm_reach_shoulder_widths(관절 기준 반경)만으로는
                          #   부족했다 — 실측 화면 캡처로 직접 확인하니, 손을
                          #   들거나 손가락을 펴는 **정상적인 제스처만으로도**
                          #   손끝이 관절 반경 경계에 바로 걸렸다(붉은 블러
                          #   테두리가 손끝 바로 앞에서 보임). 원인은 반경의
                          #   중심이 어깨·팔꿈치·손목 같은 **몸통 관절**이라는
                          #   것 — 손이 관절에서 얼마나 뻗었는지는 안 본다.
                          #   그래서 반경을 **손이 실제로 있던 자리**에도 하나
                          #   더 둔다: hand_selector.locked_box(추적 손 주변
                          #   EMA 박스, 이미 표시용으로 쓰던 값)의 대각선 ×
                          #   N/2을 반지름으로 하는 원을 관절 반경과 합친다
                          #   (preprocessor.combine_reach_masks — 합집합이라
                          #   둘 중 하나만 넣어도 선명). 이전 프레임의 손
                          #   위치이지만 프레임 간격에서 손이 그만큼 순간
                          #   이동하지 않으므로 좋은 예측치이고, 손 모양이
                          #   바뀌어도(주먹→편 손) 박스 자체가 그 변화를 담고
                          #   있어 반경이 따로 안 흔들린다.
                          #   값 근거: N=1.0이면 원이 박스 모서리에 딱 닿는
                          #   최소값이라 여유가 없다 — 1.4로 40% 여유를 둔다
                          #   (실측 전 초안). 손끝이 여전히 잘리면 ↑, 옆 사람
                          #   손이 이 반경 때문에 남으면 ↓. 0이면 이 보강 없음
                          #   (관절 반경만 — 종전 동작)
    mask_dilate_px: 8       # 선명 영역 팽창 폭(px, cv2.dilate) — 2026-08-07 3차
                          #   신설(사용자 실기 보고 — "손가락 손바닥 쪽에서
                          #   블러를 잘 못 잡는다"). Pose 세그멘테이션은
                          #   몸통 위주로 학습돼 손가락처럼 얇고 빠른(모션
                          #   블러 낀) 말단은 신뢰도가 몸통보다 낮다 — 문턱을
                          #   못 넘어 **내 손끝이 남처럼 블러되는** 역효과가
                          #   난다. mask_threshold를 낮추는 것과 달리 배경의
                          #   애매한 픽셀을 끌어들이지 않고, 이미 확실한
                          #   몸통 영역에서 바깥으로만 여유를 준다.
                          #   ★2026-08-07 4차(20→8, 사용자 실기 재확인 — "뒤에
                          #   사람이 손 올리면 블러가 풀리면서 뒷사람 손이
                          #   인식된다"): 20px는 손끝은 살렸지만, 뒷사람이
                          #   손을 들어 내 실루엣 경계에 닿을 만큼 다가오면
                          #   그 겹침 경계까지 선명 영역으로 끌어들였다 —
                          #   손끝 구제와 겹침 차단은 **같은 축(마스크 경계의
                          #   관대함)의 반대 방향**이라 한 값으로 둘 다 완전히
                          #   풀 수는 없다(원본 마스크 자체가 겹치는 두 사람
                          #   경계에서 이미 애매한 신뢰도를 내기 때문 —
                          #   mask_threshold도 같은 축). 8로 축소해 절충 —
                          #   손끝이 다시 잘리면 ↑, 뒷사람이 여전히 새면
                          #   0까지 더 낮출 것(0이면 팽창 없음). 그래도 새면
                          #   블러만으론 원리적 한계(단일 2D 카메라로는 맞닿은
                          #   두 실루엣을 픽셀 단위로 완전히 못 가른다) — 진짜
                          #   백스톱은 head_anchor.reach_shoulder_widths·
                          #   wrist_reach_shoulder_widths다

head_anchor:              # 머리 앵커(2026-07-31 몸통판 — 얼굴 검출 교체, 사용자 결정):
                          #   얼굴 검출(BlazeFace)은 마스크·썬글라스·모자·색상 조합에서
                          #   가림으로 실패 — 포즈(BlazePose)는 **몸 실루엣으로 사람을
                          #   잡고 머리 위치를 골격으로** 출력해 얼굴에 뭘 썼든 무관하다.
                          #   시선추적 모듈(회사 예정)과의 얼굴 처리 충돌도 회피 — 이
                          #   판은 얼굴을 아예 다루지 않는다. 앵커 동작(최대=사용자·
                          #   sticky·경성 게이트·연속 면제·좌/우 재라벨)은 얼굴판 그대로.
                          #   모델 = MediaPipe Pose Landmarker lite(Apache-2.0 — 상업
                          #   허용·코드공개/저작권표시 의무 없음, ~5MB, 단일 인물).
                          #   섹션 삭제 시 머리 앵커 없음(종전 — 크기+연속성 선별만)
  model_path: models/weights/pose_landmarker_lite.task  # download_weights.py가 받는다
  num_poses: 2            # 포즈로 볼 사람 수 — ★2026-08-04 실기(사용자 보고:
                          #   "다른 사람 난입 시 노이즈"). 종전 1인 고정에 구조적
                          #   구멍이 있었다: 손은 4개까지 보면서(max_num_hands) **몸은
                          #   한 사람만** 보니 "이 손이 누구 팔 끝인지"를 물을 수가 없었다.
                          #   더 나쁘게는 모델이 상대방으로 옮겨가면 내 머리가 관측에서
                          #   사라져 → 앵커가 낡음 → 유예 후 해제 → **게이트가 통째로
                          #   꺼짐** → 상대가 앵커를 차지해 내 손이 거부됐다. 사용자가
                          #   보고한 세 증상(앵커 이동·인식 손 꺼짐·골격 선 요동)이
                          #   전부 이 한 연쇄다.
                          #   2명을 보면 내 골격이 매 프레임 유지돼 연쇄가 시작되지 않고,
                          #   "누구 손목이 더 가까운가"로 손 소유자를 임계값 없이 가린다
                          #   (hand_select._is_other_persons_hand).
                          #   비용 실측(더미 프레임 30회): 1인 11.2ms / 2인 11.5ms /
                          #   3인 11.4ms — 프레임 전체를 한 번 훑는 구조라 인원 무관.
                          #   대기줄이 길어 3명 이상이 자주 겹치면 ↑
  min_detection_conf: 0.5 # 사람(포즈) 검출 최소 신뢰도 — 가림과 무관해 완화 불필요
  output_segmentation_masks: true  # 사람별 실루엣 마스크 산출 — 인식 대상 외
                          #   블러(hand_tracker.isolate_anchor_blur)의 정밀
                          #   기준(2026-08-07 신설, 사용자 결정 — "블러를 사람
                          #   누끼 딴거 제외하고").
                          #   ★2026-08-07 같은 날 껐다가 **다시 켬** — 블러 재활성화와
                          #   한 몸이다(isolate_anchor_blur.enabled 주석 참고).
                          #   블러를 끄면 이 값도 false로 내릴 것: 마스크를 쓰는
                          #   곳이 없어져 계산만 하고 버리는 비용이 된다.
                          #   ⚠비용 미실측 — 이미 낮은 FPS(3.7~7.0)에 프레임마다
                          #   마스크 산출이 더해진다. 실기로 FPS 변화를 볼 것.
                          #   키 삭제 시 기본 false(마스크 없음 — 블러는 사각형
                          #   폴백, isolate_anchor_blur 주석 참고)
  infer_fps: 10           # 머리 추론 주기 — **별도 스레드**에서 돈다(2026-07-31 키오스크
                          #   실기: 포즈 lite는 호출당 수십 ms — 손 루프 인라인이던 종전
                          #   구조는 10Hz마다 프레임을 밀어 FPS 저하 + 빠른 쓸기 추적
                          #   끊김. realtime_loop 스레드 분리로 손 루프 비차단).
                          #   머리 위치는 천천히 변해 10이면 충분
  reach_shoulder_widths: 1.8  # 팔 도달 반경 = 앵커 **어깨너비** × N (성인 어깨
                          #   ≈0.4m × 1.58 = 0.63m). 어깨 비례라 카메라 거리 무관.
                          #   ★2026-08-04 기준 교체(사용자 결정 — "앵커 기준을 어깨로.
                          #   귀는 구레나룻이 길거나 여자분이면 안 잡힐 수 있잖아").
                          #   가림 말고도 결정적 이유가 실측으로 나왔다 — 귀-귀 폭은
                          #   **고개만 돌려도** 무너진다:
                          #     변동폭  정면 5.4% / 고개 돌림 71.1%(130→47px) / 비스듬히 33.1%
                          #     어깨    정면 3.4% / 고개 돌림  8.5%           / 비스듬히  5.0%
                          #   화면을 곁눈질하는 것만으로 반경이 1/3로 쪼그라들어 내 손이
                          #   반경 밖으로 밀려났다. 중심도 어깨 중점 — 팔 도달은 머리가
                          #   아니라 어깨에서 시작한다.
                          #   값 환산: 구 5.0(머리폭) ÷ 3.16(정면 어깨/귀 비율) = 1.58.
                          #   ★2026-08-04 중심을 어깨로 내리면서 1.58 → **2.09**(사용자
                          #   결정으로 머리 기준점 제거). 중심이 귀에서 어깨로 내려간
                          #   만큼(어깨너비 × 0.51 = SHOULDER_BELOW_EAR_RATIO) 위쪽
                          #   도달이 줄기 때문에 그만큼 더한 값이다: 1.58 + 0.51 = 2.09.
                          #   **이 보정 없이 중심만 내리면 안 된다** — 그렇게 했다가
                          #   팔을 위로 끝까지 뻗을 때 게이트 통과율이 100%→88.5%로
                          #   떨어져 되돌린 적이 있다(같은 날). 옆으로도 0.51만큼
                          #   넓어지지만, 옆 사람 손은 아래 손목 반경(0.95)이 가른다 —
                          #   그 심사를 2026-08-03에 넣은 이유가 정확히 이것이다.
                          #   내 손이 잘리면 ↑, 옆 사람 손이 새면 ↓.
                          #   ★2026-08-07 좁힘(사용자 관찰 — "앵커는 안 가는데
                          #   손만 뒷사람에게 감"): 앵커가 맞아도 이 반경 하나로는
                          #   원리적으로 못 가른다는 게 바로 위 문단 내용이고,
                          #   보완 담당인 손목 반경(wrist_reach_shoulder_widths)이
                          #   손목 추적 노이즈로 자주 무력화돼(usable_wrists
                          #   비어 있으면 통째로 꺼짐 — hand_select
                          #   _filter_hands_by_anchor) 이 굵은 반경만 남는 경우가
                          #   잦았을 것으로 보임. 2.09→1.8로 절반만 좁힘(패딩
                          #   +0.51을 다 걷어내면 위로 뻗기 실측 회귀가
                          #   재발한다 — 위 문단). 실측 없이 절충한 값 — 뒷사람이
                          #   여전히 새면 더 내릴 것(단, 위로 뻗는 동작이
                          #   가로막히는지 함께 확인), 내 손이 잘리면 다시 ↑
                          #   ★경성 게이트: 앵커가 살아 있으면 반경 밖 새 손 차단
                          #   (추적 연속 면제만 예외). 앵커 부재 시엔 전부 통과
                          # ※구 wrist_reach_shoulder_widths(손목 반경 심사 0.95)는
                          #   2026-08-06 삭제(사용자 결정 — "어깨만 잡는데
                          #   팔목쪽 없애도 되지 않니"): 포즈 손목 관측이 상시
                          #   붕괴(실기 로그: 어깨폭 19~40px 요동 — 손목도 같은
                          #   붕괴에서 나온다)라 심사가 **내 손을 자르는 쪽으로만**
                          #   작동했다.
                          #   ★2026-08-07 복원(사용자 보고 "옆사람에게 조작권
                          #   뺏김" 재유입): 삭제 직후로 시점이 겹친다 — 옆 사람
                          #   손 방어가 머리 반경 단독이 되면서(원리적으로 옆 사람과
                          #   뻗은 내 손을 구분 못 한다, 위 주석) 새는 쪽이 다시
                          #   커졌을 가능성. 당시 남겨둔 복원값(0.95) 그대로 되살림.
                          #   ⚠트레이드오프 그대로 유지: 이걸 켜면 손목 붕괴로 내
                          #   손이 도로 잘리는 증상이 재발할 수 있다 — 실기에서
                          #   "옆사람 샘"과 "내 손 잘림" 중 어느 쪽이 더 아픈지
                          #   보고 결정할 것. 내 손이 잘리면 다시 삭제(주석 위 이력)
  # ★★실사용 시나리오(2026-08-07 사용자 확정 — "키오스크 줄설때 한사람씩 뒤로
  #   서잖아 그때 인식 안되면되는거야"): 이 절의 깊이 관문 3종이 겨냥하는 상황이
  #   **대기줄**이라는 것이 확정됐다. 줄은 정의상 **일렬로 뒤에 선다** — 화면
  #   (2D)에서는 앞사람과 겹쳐 보이므로 위치·반경·손목 비교로는 원리적으로 못
  #   가르고(오늘 1~12차가 전부 그래서 실패했다), **거리**로만 갈린다.
  #   거꾸로 말하면 이 시나리오는 깊이에 가장 유리하다: 줄 간격(보통 0.6~1m)이
  #   그대로 깊이 차이가 된다. 값을 고를 때 기준은 "줄 간격 얼마까지 잡을 것인가"다.
  #   환산: 사용자가 키오스크에서 D미터에 선다면, 뒷사람은 D+간격 미터다.
  #     사용자 1.0m · 뒷사람 1.5m(간격 50cm) -> 깊이비 0.67배
  #     사용자 1.0m · 뒷사람 1.8m(간격 80cm) -> 깊이비 0.56배
  #     사용자 1.0m · 뒷사람 1.3m(간격 30cm) -> 깊이비 0.77배
  #   아래 depth_reject_ratio(0.80)는 내 손 기준선(실측 1.07~1.76)에 대해
  #   **약 1.5배 이상 먼 사람**을 자른다 = 사용자 1.0m 기준 1.5m 밖. 즉 줄
  #   간격 50cm 이상이면 잡힌다. 더 바짝 붙는 줄(30cm)까지 잡으려면 ↑해야
  #   하는데 내 손 최솟값(1.07)과의 여유가 급격히 준다 — 바닥 스티커 등으로
  #   **대기선을 1m 뒤에 그어 두는 운영**이 값을 올리는 것보다 안전하다
  depth_reject_ratio: 0.80  # ★2026-08-07 신설 — **뒷사람 차단의 주력**
                          #   (hand_select._is_far_person_hand). 이 손의 깊이가
                          #   앵커 어깨너비(px)의 이 비율보다 작으면 = 앵커보다
                          #   뒤에 있는 사람의 손 → 거부.
                          #   원리: MediaPipe 손은 월드(미터)와 화면(px) 좌표를
                          #   둘 다 준다. 그 비 span_px/span_m = f/d 라
                          #   (f=초점거리 px, d=거리) **손 크기가 약분되고 거리만
                          #   남는다** — 이 엔진은 이미 이 값을 자(尺)로 쓰고
                          #   있었다(hand_shoulder_px). 앵커 어깨너비도 f×어깨m/d
                          #   이므로 두 값의 비는
                          #     (0.4 / 내_어깨m) × (d_앵커 / d_손)
                          #   같은 사람이면 뒤 항이 1이라 체형 상수만 남는다:
                          #     어깨 0.48m(넓은 체형) → 0.83
                          #     어깨 0.40m(평균)      → 1.00
                          #     어깨 0.34m(작은 체형) → 1.18
                          #   뒷사람이면 d_손이 커져 그만큼 낮아진다:
                          #     내 1.5m / 뒷사람 2.5m → 0.60배
                          #     내 1.0m / 뒷사람 2.0m → 0.50배
                          #   ★2026-08-07 실측으로 확정(초안 0.70 → 0.80).
                          #   배포 직후 실기 로그(12:47~12:50)가 위 기하 유도를
                          #   그대로 뒷받침했다 — **완전한 이봉분포**다:
                          #     내 손(통과) : 1.07 1.12 1.15 1.20 1.22 1.26
                          #                   1.38 1.72 1.76 (뒤 셋은 팔을 앞으로
                          #                   뻗은 순간 — 예측대로 값이 커진다)
                          #     먼 손(거부) : 0.51 0.53 0.59 0.60 0.64 0.65
                          #                   0.69 0.74 0.76 0.77 0.78
                          #   **0.78과 1.07 사이가 통째로 비었다** — 두 무리가
                          #   물리적으로 다른 거리에 있다는 직접 증거다(같은
                          #   사람의 노이즈라면 연속적으로 흩어진다).
                          #   그 빈 구간 안에서 내 손 최솟값(1.07)에 34% 여유를
                          #   두고 0.80으로 올렸다 — 0.70이면 0.74~0.78 무리를
                          #   절대 관문이 놓친다(그 셋은 상대 관문이 겨우 잡았고,
                          #   뒷사람만 손을 든 순간엔 상대 관문이 안 돈다).
                          #   ※팔을 앞으로 뻗으면 d_손이 **작아져** 값이 커진다
                          #     (안전한 방향 — 내 손이 잘릴 쪽이 아니다)
                          #   ⚠표본은 **한 사람·한 세션·한 거리**다. 넓은 체형은
                          #     기하상 0.83~0.95까지 내려갈 수 있어 여유가 준다 —
                          #     다른 체형 사용자가 "내 손이 안 잡힌다"고 하면
                          #     제일 먼저 이 값을 ↓(0.7). 뒷사람이 여전히 새면
                          #     ↑(0.9). 로그가 통과·거부 비를 다 남기므로
                          #     (hand_select._log_depth_verdict) 사후 판별 가능.
                          #     **키를 지우면 이 관문 없음**(종전 동작)
                          #   ※바로 뒤(수십 cm)에 붙은 사람은 깊이 차가 작아 못
                          #     가른다 — 단일 카메라의 물리적 한계
  # ※**학습 기준선(구 depth_baseline_reject_ratio)은 2026-08-07 도입 당일 제거했다.
  #   다시 만들지 말 것.** 발상은 "깊이비 = (0.4/내_어깨m) x (d_앵커/d_손) 에서
  #   앞 항은 체형 상수이니, 추적된 손에서 학습하면 순수 거리 기준을 얻는다"였다.
  #   전제가 틀렸다 — **손은 움직인다.** 팔을 뻗으면 d_손이 작아져 비가 2~3까지
  #   오르므로, 이 비는 체형 상수가 아니라 '체형 x 팔 뻗음'이다. 그 값으로 임계를
  #   올렸더니 팔을 굽히는 순간 **본인 손이 잘렸다**(실기 로그: 비 1.48/1.60/1.99/
  #   2.16인 본인 손이 거부됨). 완화 전용(min)으로 바꿔 봤으나 실측 중앙값 1.60에
  #   대해 0.8x1.60=1.28 > 0.80이라 **한 번도 채택되지 않는 죽은 코드**가 됐다.
  #   체형 대응이 필요하면 새 기계장치 대신 위 depth_reject_ratio를 낮출 것.
  depth_rel_reject_ratio: 0.70  # 위와 같은 깊이 관문의 **상대판** — 이 손의 깊이가
                          #   이번 프레임 **가장 가까운 손**의 이 비율보다 작으면
                          #   거부. 절대판(위)과 겹쳐서 쓴다(OR).
                          #   ★이쪽이 이론적으로 더 깨끗하다: 분자·분모 모두
                          #   손에서 나와 체형 상수(0.4/내_어깨)가 **약분돼
                          #   사라진다** — 체형 보정이 아예 필요 없고 남는 건
                          #   순수한 거리비(d_최근접/d_손)뿐이다. 코드베이스가
                          #   이미 신뢰하는 상대 비교 방식과 같은 성질
                          #   (_is_other_persons_hand — "임계값 없이 풀린다").
                          #   0.70 = 최근접 손보다 1.43배 이상 먼 손은 다른 사람.
                          #   ★2026-08-07 실측(같은 세션 13샘플)이 이 값을 지지:
                          #     내 손끼리 = 1.00 / 거부된 먼 손 = 0.47~0.66
                          #     — 0.70 위아래로 깨끗이 갈렸다. 특히 절대비
                          #     0.76~0.78이라 절대 관문(0.80 이전 0.70)을
                          #     통과하던 손 3건을 **이 관문이 잡아냈다** —
                          #     두 관문을 겹친 설계가 실제로 값을 했다는 근거
                          #   ※손이 하나뿐인 프레임에선 비교 대상이 없어 자동으로
                          #     꺼진다 — 그 상황(뒷사람만 손을 든 순간)은 절대판이
                          #     담당한다. 두 관문이 서로의 빈틈을 메우는 구조
                          #   ⚠내 두 손의 깊이가 크게 다르면(한 손은 앞으로 뻗고
                          #     다른 손은 몸에 붙임) 뒤쪽 손이 잘린다 — MAX_SLOTS=1
                          #     (한 손만 인식)이라 실사용 영향은 없을 것으로 보나,
                          #     "쉬는 손이 안 잡힌다"는 증상이 보이면 ↓ 또는 키 삭제
  min_operating_depth_px: 300  # **작동 거리 창**(2026-08-07 신설 — 물류창고 PDA
                          #   바코드 스캐너 발상, 사용자 제안). 손 깊이가 이 값
                          #   보다 작으면(=이 거리보다 멀면) 앵커와 무관하게 거부.
                          #   ★위 두 깊이 관문(depth_reject_ratio·
                          #   depth_rel_reject_ratio)이 못 메우는 구멍을 메운다:
                          #   그 둘은 임계가 **앵커 어깨너비에 비례**하는데,
                          #   BlazePose 어깨 붕괴(실측 12~21px — jump_reject_ratio
                          #   주석)가 나면 임계도 같이 붕괴해
                          #     0.80 × 12px = 9.6px
                          #   가 되어 **아무 손도 안 걸러진다**. 하필 붕괴가 잦은
                          #   게 사람이 겹칠 때라, 가장 필요한 순간에 관문이 꺼진다.
                          #   이 값은 카메라 기준 절대값이라 그 순간에도 살아 있다.
                          #   바코드 스캐너가 정해진 작동 거리 밖은 아예 디코딩을
                          #   시도하지 않는 것과 같은 발상 — "이 거리 밖 사람은
                          #   이 키오스크 사용자가 아니다".
                          #   값 근거(2026-08-07 실측, 같은 세션):
                          #     내 손      391 439 455 455 489 634 694 848 960
                          #     먼 사람 손 219 226 239 242 247 249 260 283 285 286
                          #   286과 391 사이에서 **낮은 쪽에 붙여** 300으로 잡았다
                          #   — 내 손을 자르는 것이 뒷사람을 놓치는 것보다 훨씬
                          #   나쁘기 때문(내 손 최솟값 391에 30% 여유).
                          #   ⚠**이 관문만 거리 불변이 아니다.** 다른 모든 임계는
                          #     어깨너비 배수라 카메라 거리와 무관하지만, 이건
                          #     px 절대값이다 — 그게 앵커 붕괴에도 사는 이유이자
                          #     한계다. 다음이 바뀌면 **반드시 재보정**할 것:
                          #     카메라 기종·렌즈 화각·해상도·설치 거리, 그리고
                          #     ★IR 카메라 전환(docs/TODO.md 예정 항목).
                          #     재보정법: 로그의 "손 깊이 %fpx"를 사용 거리에서
                          #     읽어 그 최솟값의 70~80%로 잡는다.
                          #   지금 값이 뜻하는 작동 거리 ≈ 현재 사용 거리의 1.5배
                          #   까지. 사용자가 뒤로 물러서서 안 잡히면 ↓,
                          #   먼 사람이 여전히 새면 ↑. **키를 지우면 이 관문 없음**
                          #   ★★대기줄 시나리오에서 이 관문이 **가장 적합하다**
                          #   (2026-08-07 사용자 확정 — 위 시나리오 주석):
                          #   키오스크는 사용자가 서는 자리가 사실상 고정이다
                          #   (바닥 표시·화면 위치). 그러면 "그 자리보다 뒤 =
                          #   대기줄"이 되어, 앵커에 의존하는 비율 관문보다
                          #   **이 절대 하한이 더 정확하고 더 안정적**이다.
                          #   ▶현장 보정 절차(설치 시 1회):
                          #     ①로그 레벨 INFO로 두고 실제 사용 위치에 서서
                          #       손을 든다 ②"깊이 관문 통과: 손 깊이 NNNpx"를
                          #       여러 번 읽어 **최솟값**을 확인한다
                          #     ③이 값을 그 최솟값의 0.75~0.8배로 잡는다
                          #     ④대기선 위치에 사람을 세워 "거부"가 찍히는지 확인
                          #   현재 300은 **개발 PC 실측** 기준이라 현장 설치 시
                          #   반드시 다시 잡을 것 — 카메라 거치 높이·거리가 다르면
                          #   그대로 쓰면 안 된다
  wrist_reach_shoulder_widths: 0.95  # 손목 반경 = 앵커 **포즈 손목**에서 어깨너비 × N.
                          #   도입 근거·실측 2026-08-03: 내 손↔내 손목 최대 2.30
                          #   머리폭 = 0.95 어깨너비(여유 30%). 위 이력 참고
                          # ※구 shoulder_below_head_widths(어깨선 추정)는 **삭제**했다 —
                          #   앵커 중심이 곧 어깨선이라 추정할 게 없다(hand_select
                          #   shoulder_line_y_ratio). 항목 하나와 그 오차가 함께 사라졌다
  # ※외형(상체 색상) 기반 신원 확인은 2026-08-07 도입 뒤 같은 날 **제거**했다
  #   (사용자 결정 — "그거 빼자"). DeepSORT식 발상으로 appearance_match_ratio·
  #   appearance_mismatch_ratio 두 키로 시도했으나, 두 사람 다 어두운 상의인
  #   실기 조건에서 거리가 0.16~0.28로 좁게 나와 "같은 사람"으로 오판 —
  #   방어가 아니라 뒷사람 쪽으로 **더 빨리** 넘어가는 가속 페달이 됐다(0.3→0.12로
  #   좁혀도 재발). 코드(head_detector.torso_color_hist·appearance_distance,
  #   hand_select의 appearance_confirms/denies 분기)는 남겨뒀다 — 이 두 키를
  #   다시 넣으면 켜진다. 재도입한다면 옷 색이 뚜렷이 다른 조합으로 먼저 검증할 것
  continuity_depth_ratio: 0.80  # ★**대기줄 깜빡임의 직접 해결**(2026-08-07,
                          #   사용자 보고 — "앵커 잡힌 사람은 누끼 잘 따지는데
                          #   뒤에 있는 사람의 얼굴이랑 손이 보였다가 사라졌다가
                          #   반복"). 앵커 이음 후보 중 어깨너비가 현재 앵커의
                          #   이 비율보다 **작은**(= 더 먼) 사람을 뺀다.
                          #   원인 실측: `반경 안 후보 2`가 55회 찍혔고 그 순간의
                          #   점프가 이런 모양이었다 —
                          #     어깨폭 173->462px(167%) · 중심 이동  4px
                          #     어깨폭 289->529px( 83%) · 중심 이동 11px
                          #     어깨폭 385->575px( 49%) · 중심 이동 13px
                          #   **중심은 거의 안 움직이는데 폭만 요동친다** = 일렬로
                          #   선 두 사람(2D 위치 동일·거리 상이) 사이를 chosen이
                          #   오간 것이다. 이음은 위치로만 고르므로(2026-08-04에
                          #   "크기로 고르면 지나가는 사람에게 끌려간다"는 이유로
                          #   그렇게 정했다) 대기줄을 구조적으로 못 가른다.
                          #   그 결과 저장되는 실루엣 마스크도 함께 오가서 뒷사람이
                          #   보였다 사라졌다 한다 — 앵커가 풀리지 않아도 생기므로
                          #   마스크 유지 시간(segmentation_mask_hold_sec)으로는
                          #   안 잡혔다. 위치로 못 가르는 걸 **거리**로 가른다.
                          #   값 근거: 위 교대 사례의 폭 비는 0.37·0.55·0.67·0.77
                          #   이고, 같은 사람의 폭 변화는 중앙값 필터 적용 후
                          #   실측 **0~6%**다(아래 observation_median_count).
                          #   0.80이면 교대는 전부 걸리고 같은 사람은 여유롭게 통과.
                          #   ★비대칭이라 안전하다: **더 먼(작은) 후보만** 뺀다 —
                          #   더 가까운 후보는 그대로 두므로 앵커가 어쩌다 뒷사람에게
                          #   가 있어도 앞사람으로 되돌아올 수 있다(가두지 않는다).
                          #   후보가 전부 빠지면 원래 목록을 쓴다(fail-open).
                          #   뒷사람이 여전히 교대로 잡히면 ↑, 내가 뒤로 물러설 때
                          #   앵커를 놓치면 ↓. **키를 지우면 이 방어 없음**
  observation_median_count: 3  # 관측 중앙값 필터 창 크기(홀수 권장) —
                          #   ★2026-08-07 신설. 오늘 쌓은 방어 4겹(아래
                          #   jump_reject_ratio·move_reject_ratio 관문, 2연속
                          #   합의, 추적 중 드리프트, 스트릭 안전판)은 전부
                          #   "이상값이 **들어온 뒤** 어떻게 처리할까"를 다룬다 —
                          #   그래서 서로 부딪혔다: 막으면 앵커가 굳어 내 손이
                          #   잘리고, 풀면 하이재킹이 샌다. 같은 손잡이의 양끝이라
                          #   값 조정으로는 해소가 안 된다(docs/TODO.md 3~6차가
                          #   그 반복이다).
                          #   중앙값은 층을 더 쌓는 게 아니라 **문제를 앞으로
                          #   옮긴다**: 3개 중 1개가 튀면 중앙값은 정의상 그 값을
                          #   고르지 않는다 — 이상값이 결과에 **전혀** 안 섞인다.
                          #   EMA(alpha 0.4)가 쓰레기 값의 40%를 그대로 받는
                          #   것과 근본적으로 다르다.
                          #   적합성 근거: 실측된 붕괴는 정확히 **단발 스파이크**
                          #   형태다(어깨폭 209→18→200px처럼 한 프레임만 무너진다 —
                          #   아래 jump_reject_ratio 주석의 실측). 중앙값이 가장
                          #   잘 듣는 형태이고, 2프레임 연속 같은 방향으로 무너지는
                          #   경우만 통과한다.
                          #   비용: 지연 (N-1)/2 프레임 = 10Hz에서 0.1초. 사람
                          #   이동 속도에 견주면 무시할 만하다.
                          #   앵커가 굼뜨면 ↓(2 = 사실상 비활성), 붕괴가 계속
                          #   새면 ↑(5 — 단 지연이 0.2초로 늘어난다).
                          #   **키를 지우면 필터 없음**(종전 — 관측 그대로)
  jump_reject_ratio: 0.25 # 어깨폭이 한 주기에 이 비율 이상 변하면 그 관측을 **버린다**
                          #   (중심·폭·손목·어깨·팔꿈치 전부 — 같은 붕괴에서 나온다).
                          #   ★2026-08-04 실기 로그가 원인을 특정했다(사용자 보고
                          #   "기준점·선이 흔들린다 · 검은 옷에 주머니에 손 넣으면
                          #   못 찾는다"): 점프 로그가 거의 전부 `관측 1명 · 반경 안
                          #   후보 1`이었다 — 남에게 끌려간 게 아니라 **같은 사람의
                          #   어깨 관측이 무너진 것**이다.
                          #     어깨폭 209→18px(91%) · 73→192px(163%) · 163→12px(92%)
                          #   12~21px는 사람 어깨가 아니다. 반경이 어깨폭 × 2.09라
                          #   어깨폭 12px면 반경 25px로 쪼그라들어 내 손이 통째로
                          #   거부된다 — 흔들림과 인식 끊김이 같은 뿌리다.
                          #   값 근거(같은 날 실측, 오염 없는 단계 2종): 정상 변화율
                          #   중앙 0.02 · 95% 0.10. 걸어서 다가와도 0.1초에 10%쯤
                          #   (1.5m 거리·1.5m/s = 15cm). 붕괴는 0.2~1.6이라 사이가 빈다.
                          #   ※가시성으로는 못 거른다 — 붕괴 프레임도 visibility가
                          #     0.999다(같은 날 실측). 그 안은 폐기했다
                          #   내 손이 잘리면 ↑(관측을 더 받아들임), 흔들림이 남으면 ↓.
                          #   **키를 지우면 관문 없음**(종전 — 붕괴가 그대로 들어온다)
                          #   ★2026-08-07 2차 실험(사용자 보고 "뒷사람에게 조작권
                          #   뺏김" — docs/TODO.md "겹침에서 앵커가 뒷사람에게
                          #   넘어간다" 항목): 그 항목이 재구성한 실측(어깨폭
                          #   316→222px = 29.7% 변화)이 종전 0.35보다 낮아 이 관문을
                          #   그냥 통과했을 가능성 — 0.35→0.25로 낮춰 걸리게 한다.
                          #   정상 변화 상한(95% 0.10)보다 여전히 2.5배 여유 있어
