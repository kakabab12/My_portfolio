                          #   통과했다. jump_log_ratio가 이미 재던 move_ratio를 관문으로
                          #   승격 — 같은 값(0.20)을 재사용(정상 변화율 95% 0.10의 2배,
                          #   jump_log_ratio 도입 근거와 동일). 내 손이 잘리면 ↑,
                          #   옆/뒷사람이 여전히 새면 ↓. 키 삭제 시 위치 관문 없음(종전)
  jump_log_ratio: 0.20    # 앵커가 한 주기에 이 비율 이상 움직이면 로그로 남긴다
                          #   (어깨폭 변화율 또는 중심 이동÷어깨너비 중 큰 쪽).
