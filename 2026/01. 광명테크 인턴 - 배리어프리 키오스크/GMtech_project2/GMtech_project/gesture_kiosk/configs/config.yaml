                          #   합성 단계로는 못 잡고, 실사용 중 나온 순간을 받아 적는다.
                          #   값 근거: 오염 없는 단계 2종(제자리·고개 돌리기) 실측
                          #   어깨폭 변화율 중앙 0.02 · 95% 0.10 — 그 2배를 넘으면
                          #   사람이 그렇게 못 움직인 것이라 관측이 남에게 간 것이다.
                          #   정상 사용에선 거의 안 찍힌다. 로그가 넘치면 ↑,
                          #   증상이 나는데 안 찍히면 ↓. **키를 지우면 로그 없음**
  segmentation_mask_hold_sec: 1.5  # 실루엣 마스크 유지 시간 — ★2026-08-07 신설
                          #   (사용자 보고 — "앵커 안 잡혀있는 뒤에 있는 사람의
                          #   얼굴이랑 손이 보였다가 사라졌다가 반복").
                          #   원인은 **블러가 통째로 꺼지는 구간**이었다: 앵커가
                          #   풀리면 마스크가 없어지고, 폴백인 사각형도 앵커가
                          #   없으니 못 만들며, blur_outside_region(frame, None)은
                          #   원본을 그대로 돌려준다 — 즉 블러가 사라져 대기줄이
                          #   통째로 노출된다. 실측 로그에서 한 세션에 앵커
                          #   해제 39회·획득 62회였으니 그만큼 깜빡였다.
                          #   앵커가 잠깐 끊기는 건 사용자가 떠난 게 아니라 거의
                          #   항상 검출 공백이다 — 그 사이 직전 마스크를 붙들어
                          #   블러를 유지한다. 0.5초 지난 마스크로 배경을 흐리는
                          #   쪽이, 블러를 꺼서 뒷사람을 노출하는 것보다 낫다.
                          #   ★반드시 아래 anchor_grace_sec보다 **길어야** 한다 —
                          #   둘 다 "마지막 관측"부터 재므로 같은 값이면 앵커가
                          #   풀리는 순간 마스크도 함께 만료돼 공백을 하나도 못
                          #   메운다(단위 테스트가 이 실수를 잡았다).
                          #   ★2026-08-07 2.0 -> 1.5로 축소: 붙들고 있는 마스크는
                          #   **낡은 위치**다. 사용자가 움직이는 중에 오래 붙들면
                          #   지금 손이 있는 자리가 블러돼 **손 모델이 내 손을 못
                          #   본다** — 깜빡임(디버그 창 한정)보다 이쪽이 실제
                          #   기능 실패라 더 나쁘다. 다만 anchor_grace_sec(1.0)
                          #   보다는 길어야 공백을 메우므로 1.0으로는 못 내린다
                          #   (같은 값이면 앵커와 함께 만료돼 무의미 — 위 문단).
                          #   깜빡임이 남으면 ↑, 움직일 때 손이 안 잡히면 ↓
                          #   (단 1.0 초과 유지). anchor_grace_sec을 함께 줄이면
                          #   더 낮출 수 있다
  anchor_grace_sec: 1.0   # 머리 소실 유예 — 이 시간까지 앵커 유지(잠깐 가림 흡수).
                          #   초과 시 게이트 해제(모든 손 통과).
                          #   ★sticky(2026-07-31 실기 — 앵커가 다른 관측으로 옮겨감):
                          #   앵커가 살아 있는 동안 다른 머리는 크기 무관 무시, 교체는
                          #   사용자가 떠나 유예가 앵커를 푼 뒤에만 (hand_select)

hand_select:              # 사용자 손 선별(2026-07-31 단일 손 추적 — 라벨 제거, 사용자
                          #   결정): 좌/우 라벨을 정체성 키에서 버리고 공간 연속성으로
                          #   손 **하나**를 추적한다 — handedness 불안정발 버그 계열
                          #   (획 씹힘·배구 토스) 구조 제거. 거리 자(尺)는 손 실측 크기
                          #   (월드 랜드마크 미터) 기반 가상 어깨너비 — 기존 임계 체계 유지
  release_sec: 2.0        # 손이 이 시간 동안 안 보이면 사용 종료 — 유휴 전환 + 추적
                          #   정체성 해제(다음 손은 획득부터 — 다른 사용자 승계 차단)
  acquire:                # 획득 기준(구 command_hand_lock v2의 라벨 없는 계승) — 모양이
                          #   보이는 손이 실제로 움직이면 사용자 손. 쉬는 손·떠 있는
                          #   손은 영원히 안 잡힌다 (들어 올리는 동작 자체가 획득이 됨)
    move_dist_shoulder: 0.25  # 획득 최소 이동(어깨너비) — 떨림(±0.02)보다 훨씬 크고
                          #   플릭(0.28)보다 살짝 작게. 쉬는 손·잡음에 오획득되면 ↑
    window_sec: 0.5       # 획득 이동을 재는 최근 구간(초)
  takeover_idle_sec: 5.0  # 인계 — 추적 손이 이만큼 **연속으로** 놀면(창 안 이동이 위
                          #   ★2026-08-07 1.5 -> 5.0(시나리오 확정: **배리어 프리**
                          #   키오스크 · 동사무소·법원 등 사람 많은 곳).
                          #   1.5초는 이 용도에 명백히 짧다. 인계는 "추적 손이
                          #   논다"만으로 열리는 **유일한 정상 경로**인데,
                          #   배리어 프리 사용자(고령·장애인·휠체어)는 화면을
                          #   읽거나 다음 동작을 준비하며 **수 초씩 멈추는 것이
                          #   정상 사용**이다. 1.5초면 그 정상적인 멈춤마다
                          #   대기줄 사람에게 도전 틈이 열린다 — 법원·동사무소
                          #   민원 화면에서 조작권을 뺏기는 것은 단순 불편이
                          #   아니라 개인정보·업무 중단 문제다.
                          #   ※깊이 관문이 뒷사람 손을 먼저 막지만, 그건 마지막
                          #     방어선이다. 애초에 **틈을 열지 않는 것**이 먼저다
                          #     (다층 방어 — 한 층이 실패해도 다음이 받친다).
                          #   ⚠트레이드오프: 진짜로 다른 손으로 바꾸고 싶을 때
                          #     (예: 오른손 쓰다 왼손으로) 5초를 기다려야 한다.
                          #     실기에서 답답하면 ↓, 뺏김이 보이면 ↑.
                          #     아래 2026-08-03 실측 이력도 함께 볼 것
                          #   move_dist_shoulder 미만) 다른 손의 지시를 받아 넘긴다.
                          #   ★2026-08-03 실기(사용자 보고: "아예 배에 있는 손에 고정돼
                          #   버린다"): 종전엔 한번 잡힌 손을 2초 소실 전에는 절대 안 놓아,
                          #   배 앞의 쉬는 손이 먼저 잡히면 다른 손으로 아무리 크게
                          #   제스처해도 못 들어왔다.
                          #   지속 시간을 요구하는 이유(같은 날 실측): 조건을 "유휴"만으로
                          #   걸었더니 10초에 인계가 4번 나 추적이 두 손을 오갔다(위 손
                          #   추적 64%) — **쓸기 사이의 짧은 멈춤**(0.3~0.5초)도 유휴로
                          #   잡히기 때문. 손을 놓아둔 상태(수 초)와 가르려면 시간이 필요하다.
                          #   인계가 잦으면(추적이 오감) ↑, 배 앞 손에서 안 풀리면 ↓.
                          #   ※키를 지우면 인계 없음(종전 동작 — 2초 소실만이 해제)
  hand_shape:                 # 손 모양 판별(hand_shape.py 기하 규칙 — 2026-07-28 v3:
                              #   입력이 MediaPipe 21점이라 아래 비율은 **3D 거리** 기준.
                              #   min_center_points는 제거 — MediaPipe가 21점을 항상 채움)
    extend_ratio: 1.05        # 손가락 "펴짐" 기준 — 손끝-손목뿌리 3D 거리가 둘째 관절(PIP)-
                              #   뿌리 거리의 N배 이상.
                              #   ★2026-08-03 보정 세션 재확인(사용자 결정 — 보수적 조정):
                              #   굽힘 0.53~0.74(p90) · 폄 1.37~1.44로 **0.75~1.37이 완전히
                              #   비어** 있다. 0.95→1.05로 올려 굽힌 손가락이 순간 "폄"으로
                              #   읽히던 프레임(주먹→한 손가락 오판 28/152)을 줄인다 —
                              #   폄 실측 하한(1.37)과 멀어 인식 손해는 없다.
                              #   (2026-07-28 1차 보정 1.35→0.95 이력: 당시 세운 검지
                              #   1.33~1.39, 가리키는 검지 1.04~1.34 — 가리키기도 "폄"이
                              #   되어야 탐색 항법이 유지된다는 근거는 지금도 유효)
    min_valid_fingers: 3      # 판별에 필요한 판단 가능 손가락(검지~새끼) 최소 개수 —
                              #   미만이면 모양 불명(None): 블러·원거리에서 단정하지 않는다
    curl_confirm_ratio: 0.85  # 굽힘 "확인" 기준: 손끝-뿌리가 PIP-뿌리의 이 비율 이하(또는
                              #   관절 방향 반전)일 때만 굽힘. 그 사이(0.85~0.95)는 기권.
                              #   2026-07-28 실측: 굽힌 손가락은 전 자세에서 0.51~0.78 —
                              #   0.85면 여유 있게 덮고 폄(≥1.04)과 안 겹친다 (0.9→0.85)
                              # ※2026-08-03 처진 손 오판(사용자 보고: "팔 가로 + 손목 아래로면
                              #   검지 주먹이 주먹으로 들어감")에 대해 두 가지를 넣었다가 **둘 다
                              #   되돌렸다.** 다시 파지 않도록 근거는 hand_shape.py 첫머리 주석에
                              #   남겼다 — 요지: ①PIP 관절각 임계(101°)는 실기에서 주먹의 20%를
                              #   finger로 오판 ②손바닥 정면도 게이트(0.45)는 **정지 자세만 재서
                              #   생긴 착시** — 움직이는 실사용에서는 정상 자세의 90%가 게이트에
                              #   걸려 판별이 멈췄고, 래치가 굳어 주먹·손바닥이 전부 finger로
                              #   나갔다. 임계는 반드시 **움직이는 손**으로 잴 것.

gestures:
  grab_select:                # 손 펼침 → 주먹 N회 = select (2026-08-03 사용자 결정).
                              #   종전 select는 "한 손가락 + 위 쓸기"였는데 팔을 들어올리는
                              #   동작과 구분이 어려워 오발이 잦았다. 쓸기가 아니라 **모양
                              #   전환**으로 옮겨 이동 궤적과 완전히 분리했다.
                              #   키 삭제 시 기능 없음 — 그러면 select를 낼 방법이 없다
                              #   (위 쓸기 경로는 EVENT_BY_SHAPE에서 함께 제거됐다)
    repeat_count: 1           # 쥐기 몇 회로 확정할지 — ★2026-08-04 사용자 결정으로
                              #   2 → 1 (한 번 쥐면 select). 아래 dwell_sec이 반드시
                              #   함께 있어야 한다 — 이유는 그 항목 주석
    dwell_sec: 0.0            # 쥔 뒤 **그 자리에 머물러야** 하는 시간(초). 0 = 즉시 발화.
                              #   ★2026-08-04 사용자 결정 0.4 → 0 ("주먹 접히는거
                              #   인식되면 바로 보내면 된다"). 실기에서 select가 굼떴다:
                              #   래치 전환 0.27초(switch_frames 8) + 유예 0.4 ≈ 0.67초라
                              #   체감 1초였고, 쥐었다 **바로 펴면** 유예를 못 채워
                              #   통째로 씹혔다(사용자 보고).
                              #   ⚠감수하는 것(같은 날 결정 뒤집기 전 근거 그대로):
                              #   유예는 back·home·confirm의 select 오발을 막는 유일한
                              #   방어였다 — 명령은 반드시 주먹을 거치므로, 손바닥에서
                              #   주먹으로 바꾸는 순간 select가 먼저 나가고 뒤이어 명령이
                              #   나간다(이벤트 2개). max_move_shoulder는 쥐기 **사이**만
                              #   보는데 repeat_count가 1이라 사이가 없다.
                              #   ※단 손바닥을 거치지 않으면(한 손가락 → 주먹) select는
                              #   안 나간다 — _has_seen_open 조건. 오발이 실제로 거슬리면
                              #   0.2~0.25로 되돌리는 것이 첫 후보다 (docs/TODO.md)
    max_move_shoulder: 0.25   # 제자리 반경(어깨너비 배수) — 쥔 자리에서 이보다
                              #   벗어나면 select를 버린다(쓸기 = 명령이다).
                              #   repeat_count가 2 이상이면 쥐기 **사이**의 이동도
                              #   같은 반경으로 감시한다
    window_sec: 3.0           # 첫 쥐기부터 이 시간 안에 repeat_count회를 채워야 한다.
                              #   래치 전환이 switch_frames(8프레임 ≈ 0.27초)를 요구하므로
                              #   펼침→주먹 2회는 최소 ≈1.1초가 든다 — 3.0은 그 두 배 남짓.
                              #   ※실기 미측정(2026-08-03 신설) — 두 번째 쥐기가 자꾸
                              #   놓치면 ↑, 무심코 쥐었다 폈다 하다 select가 튀면 ↓
  tap_click:                  # 한 손가락 제자리 더블 탭 = click (2026-07-31 사용자 요청).
                              #   ★2026-08-03 판정 방식 교체(보정 세션 실측 + 사용자 결정):
                              #   종전엔 손 전체가 "주먹"으로 읽히는 순간을 셌는데, 검지만
                              #   까딱하면 비율이 1.35→0.97까지만 내려가 주먹 기준선(0.85)에
                              #   **아예 도달하지 않는다** — 감지율 0/8·3/6으로 사실상 미동작
                              #   이었고, 현장에서도 "손목을 크게 두 번 해야 인식"됐다.
                              #   이제 **검지 비율의 일시적 하강**으로 읽는다 (모양 판별과
                              #   무관 — gesture_filter._update_tap_click). 키 삭제 시 기능 없음
    dip_drop_ratio: 0.19      # 까딱 판정 — 검지 비율이 기준선(폄 상태 최대) 대비 이 비율  # [자동보정 2026-08-03] 검지 까딱 실측 하강 0.22 × 0.85
                              #   이상 내려갔다 돌아오면 1회.
                              #   ★2026-08-03 현장 완화(사용자 보고: "검지 까딱이 아직 잘
                              #   안 된다"): 책상 앞 실측(기준선 1.347·까딱 바닥 0.967)으로
                              #   20%를 골랐으나 키오스크 거리에서는 손이 작게 잡혀 하강이
                              #   얕아진다 — 0.15로 낮춘다(기준선도 최근 1초 창의 최대로 정정 —
                              #   종전 고정 최대는 시간이 갈수록 과민해졌다). 떨림 오발은 ①2회 연속 ②시간 창
                              #   ③제자리 반경 ④최소 간격이 4중으로 막는다.
                              #   ※계기판(cam on)의 TAP 줄에서 idx가 low 아래로 내려가는지
                              #   보고 조정할 것 — 안 내려가면 ↓, 가만히 있는데 dips가
                              #   오르면 ↑ (책상 실측 감지수: 10%→21, 15%→20, 20%→12, 기대 8)
    move_dip_shoulder: 0.128   # 손목 까딱 채널(2026-08-03 사용자 요청 — "검지 까딱과  # [자동보정 2026-08-03] 손목 까딱 실측 0.18 × 0.85 (위 쓸기 임계의 80%=0.13로 제한)
                              #   손목 까딱 둘 다 인식"): 손이 최근 최고점보다 이만큼
                              #   (어깨너비 배수) **아래로** 내려갔다 돌아오면 까딱 1회.
                              #   검지 까딱은 손 위치가 안 변하고 손목 까딱은 검지 비율이
                              #   안 변해 — 한 채널만으론 반쪽만 잡힌다.
                              #   ★아래 방향으로 한정한 이유: 위로 까딱하면 위 쓸기
                              #   (select)와 같은 동작이라 구분 불가 — 아래는 정의 없는
                              #   방향이라 충돌이 없다. 그래서 **min_dist_y(0.16)보다
                              #   작게** 유지할 것 — 크면 까딱이 select로 먼저 확정된다.
                              #   손목 까딱이 안 잡히면 ↓, 손 흔들림에 오발이면 ↑
    window_sec: 1.2           # 첫 까딱 직전부터 둘째 복귀까지 시간 한도 — 탭 2번이
                              #   이 안에 끝나야 한다. 느긋한 탭이 안 잡히면 ↑
    max_move_shoulder: 0.25   # 제자리 반경(어깨너비) — 초과 이동 시 처음부터.
                              #   쓸기·이동 중 블러 출렁임의 click 오발 차단.
                              #   실측(2026-08-03): 탭 중 손 이동은 0.023(p90)으로 매우 작다
  cooldown_sec: 0.5           # 이벤트 확정 직후 입력 무시 시간 — **같은 획이 두 번
                              #   확정되는 것** 방지.
                              #   ★2026-08-04 인하(0.9→0.5, 사용자 요청: "사람들이
                              #   제스처를 천천히 하지 않는다"). 실측 근거: 빠른 쓸기에서
                              #   손 추적률 92.7%·동작→이벤트 187ms로 파이프라인은 이미
                              #   따라간다 — 연속 조작의 병목은 이 값이었다(이벤트 간격
                              #   중앙 1195~1344ms 중 900ms가 쿨다운. 목록 3칸에 2.7초).
                              #   ※내리기 전에 **복귀 삼킴을 먼저 고쳤다**: 쿨다운 중에도
                              #   궤적을 쌓게 해(gesture_filter _is_in_cooldown 분기) 삼킴이
                              #   "직전 획 끝을 지나왔는가"를 판단할 증거를 남긴다. 그 전에
                              #   0.5로 내렸을 때는 되돌아오는 팔이 반대 이벤트로 튀었다.
                              #   ※하한: 0.4까지 테스트 통과, 0.3에서 **한 획이 두 번**
                              #   확정된다(시나리오 15) — 궤적을 쌓는 만큼 계속 뻗는 획이
                              #   쿨다운 종료 시 이미 임계를 넘어 있을 수 있다. 0.5는 한 칸 여유.
                              #   같은 동작이 두 번 나가면 ↑, 연속 조작이 답답하면 ↓(0.4까지)
  swipe:                      # 팔 쓸기 — 포즈 궤적 판정: 손이 없는 사용자도 동일 (범용 설계)
    # 거리 임계 단위 = **어깨너비 배수** (2026-07-16 정규화) — 카메라 거리·설치 위치가
    # 달라져도 "자기 어깨너비의 몇 배를 움직였나"로 판정돼 같은 동작이 같은 결과를 낸다
    window_sec: 0.8           # 이 시간 안의 이동량으로 판정 — 느긋한 쓸기 허용
                              #   (2026-07-16 0.6→0.8, cooldown_sec보다 짧게 유지)
    min_dist_x_shoulder: 0.55 # 좌/우 쓸기 확정 최소 이동 (어깨너비 배수 ≈ 22cm)
                              #   ★2026-08-03 현장 재확인 후 **0.55로 복원**(사용자 보고:
                              #   "좌우는 처음 값이 제일 잘된다"). 같은 날 보정 세션에서
                              #   책상 앞 "작게" 쓸기 실측(0.223~0.311)에 맞춰 0.20으로
                              #   내렸으나 키오스크 실사용에서는 오히려 나빴다 —
                              #   서서 하는 실제 동작은 책상 앞보다 크고, 임계가 낮으면
                              #   예비 동작·복귀가 먼저 확정돼 방향이 튀는 것으로 보인다.
                              #   ※교훈: 앉아서 잰 값을 서서 쓰는 임계로 그대로 쓰지 말 것.
                              #   2026-07-16 실기 2차 완화 이력: 1.1→0.8→0.55
                              #   2026-07-16 실기 2차 완화: 팔꿈치 고정 전완 플릭도 인식되게
                              #   (1.1→0.8→0.55 — 오탐은 최소 프레임·주축 우세·삼킴이 방어)
    min_dist_y_shoulder: 0.16 # 위 쓸기(select/home) 확정 최소 이동 (어깨너비 배수).
                              #   ★2026-08-03 보정 세션 실측(사용자 결정): "작게" 위 쓸기
                              #   5회가 0.183·0.194·0.203·0.206·0.226으로 매우 일정한데
                              #   종전 0.30은 **전부 미달** — 현장의 "위만 유독 안 먹힌다"가
                              #   이 수치 그대로였다. 작은 쪽 최소값(0.183)보다 12% 아래로.
                              #   ※위 방향은 들어올리기 게이트(raise_guard)가 2차 방어 —
                              #   오발이 늘면 게이트부터 확인하고 그 다음 이 값을 ↑
                              #   (2026-07-28 0.35→0.30, 07-29 아래 방향 제거 이력)
    axis_dominance: 1.3       # 주축 진행도가 부축의 N배 이상일 때만 확정 — 대각선 오인 보류.
                              #   2026-07-28 실기: 아래 쓸기가 팔꿈치 호 때문에 가로 성분이
                              #   섞여 보류되던 것 완화 (1.5→1.3. 대각선 오인 늘면 복원)
    min_track_frames: 4       # 최소 궤적 프레임 — 키포인트 튐 1~2프레임 오발 방지
    # 플릭 경로(2026-07-22 — 사람마다 동작 크기 제각각): 이동량이 위 임계에 못 미쳐도
    # **최근 짧은 구간(flick_window_sec)** 에서 flick_min_dist 이상 단호하게 움직였으면
    # 확정한다. 손목만 까딱하는 작은 플릭을 살리고, 느린 배회는 어느 짧은 구간에서도
    # 미달이라 걸러진다. 계기판 swipe_speed_x/y(어깨너비/초, 최근 구간)를 보며 튜닝 —
    # 실기 전 초안값. 키(flick_window_sec) 삭제 시 종전(이동량 단독) 동작
    flick_window_sec: 0.2      # 최근 이동을 재는 구간 — 이 안에 아래 이동이 나면 플릭.
                               #   전체 창(window_sec)이 아니라 최근 구간이라 정지 후 튀는
                               #   빠른 동작을 잡는다(전체 창은 앞선 정지에 희석돼 놓침)
    flick_min_dist_shoulder: 0.25  # 그 구간의 최소 이동(어깨너비) — 본 임계(0.55/0.16)보다 낮게.
                               #   ★2026-08-03: 좌우 본 임계를 0.55로 복원하면서 함께 조정.
                               #   0.28(종전) → 0.25 — 위 임계(0.16)가 낮아진 것과 균형을 맞춰
                               #   "짧고 빠른 까딱"을 조금 더 살리되 종전 감각을 크게 안 바꾼다.
                               #   작은 동작 놓치면 ↓, 오발 잦으면 ↑ (정지 떨림은 이 바닥이 차단)
    first_line:               # 첫 선 방향 고정(2026-07-28 사용자 제안): 방향을 창 전체
                              #   이동량의 주축이 아니라 **원점(정지 지점)을 떠나는 첫 이동
                              #   벡터**로 확정 — 사람마다 궤적(호·갈고리·되돌림)이 달라도
                              #   시작 방향이 의도를 반영한다. 고정 해제는 정지·원점 복귀
                              #   (새 원점 재장전)·꺾임 재고정(아래 relock). 발화 임계·플릭·
                              #   삼킴·게이트는 기존 유지(방향 결정만 교체). 키 삭제 시 종전(창 주축)
      lock_dist_shoulder: 0.12   # 원점에서 이 거리(어깨너비 배수)를 벗어나는 순간의 벡터로
                              #   고정 — 필터 후 떨림(±0.02)보다 크고 임계(0.3~0.55)보다 작게.
                              #   너무 작으면 출발 떨림에 오고정, 너무 크면 호 초입이 섞인다
      still_speed_shoulder: 0.5  # 이 속도(어깨너비/초) 미만이면 "정지" — 원점을 현재 위치로
                              #   갱신하고 고정 해제(재장전). 래치 동결(1.0)보다 낮게
      relock_dist_shoulder: 0.24  # 꺾임 재고정(2026-07-29 실기): 예비 동작(살짝 들기·당기기)이
                              #   방향을 선점하면 진짜 쓸기가 축 불일치로 무시되던 문제 —
                              #   고정 방향 진행이 멈춘 극점에서 이 거리 이상 다른 우세 축으로
                              #   꺾이면 극점을 새 원점 삼아 재고정("새 첫 선"). lock(0.12)의
                              #   2배 — 작은 갈고리 꼬리는 계속 무시. 재고정 오발이 나면 ↑,
                              #   여전히 무반응 체감이면 ↓. 키 삭제 시 재고정 없음(종전)
    # switch_margin_y(높이 비교)·side_flap_jump(라벨 플랩 보정)·command_hand_lock
    # (지시 손 고정 v2)은 2026-07-31 라벨 제거로 소멸 — 손 정체성(획득·이음·해제)은
    # hand_select의 단일 손 추적(acquire·release_sec)이 맡는다
    shape_latch:              # 모양 래치(2026-07-28 v3 — 구 다수결(fist_vote_dominance)·
                              #   모양 기억(shape_hold_sec) 대체): 프레임별 판별 출렁임이
                              #   판정을 오염시키던 것을 상태기로 교정 — 저속에서 연속
                              #   판별로 고정하고, 빠른 이동 중(모션 블러 — 판별이 가장
                              #   부정확한 순간)엔 판별을 무시하며, 반대 모양이 연속 확인될
                              #   때만 전환한다. 해제는 손 소실 시에만. 키 삭제 시 프레임
                              #   추종(래치 없음 — 구 동작 근사)
      latch_frames: 4         # 무래치 → 고정: 같은 판별 N프레임 연속 (30 FPS ≈ 0.13초)
      switch_frames: 8        # 고정 → 반대 모양 전환: 반대 판별 N프레임 연속 (≈0.27초).
                              #   모양을 바꾸면 잠깐(0.3초) 보여준 뒤 쓸어야 한다 — 안내
                              #   문구 대상. 전환이 굼뜨면 ↓(5~6), 오전환 남으면 ↑
      freeze_speed_shoulder: 1.0  # 이 속도(어깨너비/초) 이상 이동 중엔 판별 동결 —
                              #   쓸기 중엔 고정 모양이 그대로 유지된다
      release_sec: 1.5        # 손 소실 후 이 시간 안에 추적 손이 돌아오면 래치 유지
                              #   (2026-07-28 실측: 화면을 가리키면 손바닥이 가려져 손 검출이
                              #   수 초씩 끊긴다 — 즉시 해제하면 재등장마다 재고정 필요).
                              #   같은 손 여부는 hand_select 연속성이 보장(2026-07-31 라벨
                              #   제거) — hand_select.release_sec(2.0)보다 짧게 유지할 것:
                              #   새 손 획득 전에 래치가 먼저 비워져야 승계가 안 된다
    return_suppress_sec: 1.4  # 반대 방향 1회 삼킴 창 — 동작 후 이 시간 안 + 아래 위치 조건을
                              #   모두 만족하는 반대 쓸기 1건을 복귀로 무시 (쿨다운보다 길게).
                              #   2026-07-16 실기: 2.5는 의도적 반대 쓸기(우→좌)까지 먹어 단축.
                              #   2026-07-28 실기(노트북): 재장전 체감 지연 — 1.6→1.4.
                              #   ★1.2는 금지: 쿨다운(0.9)만큼 기다렸다 복귀하는 패턴이
                              #   창 밖으로 새어 반대 이벤트 오발 (시나리오 test_11 검증)
    return_origin_shoulder: 0.6   # 복귀 위치 조건 — 반대 쓸기의 시작점이 직전 획 끝에서
                                  #   어깨너비 0.6배 안일 때만 복귀로 인정 (중앙에서 다시
                                  #   시작하는 의도적 쓸기는 시간 창 안이어도 통과)
    return_reach_shoulder: 0.4    # 복귀 종료 기준(2026-07-22 — 속도 경로 대응) — 복귀가
                                  #   직전 획 **출발지**를 어깨너비 0.4배 이상 지나치면 단순
                                  #   복귀가 아니라 반대로 크게 쓰는 의도적 동작이라 삼킴 해제.
                                  #   속도 경로가 복귀 꼬리를 잘게 재검출해도 출발지 안이면
                                  #   계속 삼켜 오발 방지. 키 삭제 시 0(지나침 판정 없음)
    dropout_grace_sec: 0.35   # 소실 유예(2026-07-20) — 빠른 동작의 모션 블러로 추적점이
                              #   순간 끊겨도 이 시간 안이면 궤적을 유지한다:
                              #   즉시 리셋하면 빠른 쓸기가 통째로 유실(시뮬 실증).
                              #   2026-07-29 실기 0.15→0.35: 주먹 회전(앞면→옆면)의 손
                              #   검출 탈락이 0.15보다 길어 ok 스트로크가 끊겼다
                              #   (1차 방어 — 그보다 긴 탈락은 손목 브리지가 잇는다).
                              #   팔 교체는 좌표가 달라 유예 없이 리셋 유지 (주먹↔한 손가락
                              #   모양 전환은 손 중심 좌표가 연속이라 리셋 대상 아님)
    raise_guard_below_shoulder: 1.2  # 팔 들어올리기 게이트(2026-07-20 실기) — 추적점이
                              #   어깨선 아래 어깨너비 1.2배(휴식 존 — 팔 처진 위치)에 최근
                              #   머물렀다면 위 방향을 이벤트(top·home)로 치지 않는다: 동작 전
                              #   들어올리기가 확인/처음으로 오발되던 것 차단. 키 삭제 시 게이트 없음
    raise_guard_grace_sec: 0.6    # 휴식 존 이탈 후 이 시간 안의 위 쓸기는 들어올리기 —
                              #   들고 나서 이만큼 멈춘 뒤의 위 스냅은 정상 top/home
    point_filter:             # 추적점 One Euro 필터 (2026-07-20 정확도 1단계 — 떨림 저감).
                              #   속도 적응형: 정지 시 떨림을 강하게 거르고 빠른 쓸기는 지연 없이
                              #   따라간다 (point_filter.py 주석 — 공개 알고리즘 직접 구현, 의무 없음)
      enabled: true
      min_cutoff_hz: 1.5      # 정지 시 컷오프 — 낮출수록 떨림 제거 강함(대신 느린 동작 지연↑)
      beta: 1.0               # 속도 반응 계수 — 클수록 빠른 쓸기에서 원신호를 더 믿는다(지연↓)
      d_cutoff_hz: 1.0        # 속도 추정 자체의 평활 컷오프 (보통 1.0 고정)
    body_scale:               # 거리 자(尺)의 안정화 — 2026-07-29부터 hand_select.
                              #   hand_scale_ratio(손 실측 크기 기반 **가상 어깨너비**)가
                              #   공급한다: px/m 환산 × 표준 어깨 0.4m — 어깨 자와 등가라
                              #   위 임계(어깨너비 배수) 숫자가 그대로 유지된다
      fallback_ratio: 0.22    # 손 미관측 시 가정값(가상 어깨너비/프레임폭) — 표준 거리 기준.
                              #   이 값일 때 위 임계들이 종전 화면 비율 임계와 정확히 등가
      min_ratio: 0.05         # 하한 클램프 — 측면으로 돌아 어깨가 좁아져도 임계 과민 방지.
                              #   2026-07-16 0.08→0.05: 멀리(앉아서) 있는 사용자의 실제 어깨가
                              #   하한에 걸리면 요구 이동량이 부풀어 원거리 인식이 어려워진다
      max_ratio: 0.32         # 상한 클램프(2026-07-16) — 카메라 근접 시 요구 이동량이
                              #   화면폭 ~26%를 넘지 않게: 팔이 프레임을 나가기 전에 확정된다
      alpha: 0.1              # EMA 평활 계수 — 프레임 단위 출렁임 흡수

hand_bend:                  # 손 꺾임(포스처) 판 — 2026-08-05 신설 (feat/hand_bend 판,
                            #   사용자 결정). 쓸기·로터를 전부 대체한다: 판정기
                            #   (hand_bend.py)가 gesture_filter의 쓸기·탭·쥐기
                            #   이벤트를 전부 삼키고, 아래 자세 6종만 파이프로 낸다.
                            #   ※로터(rotor) 섹션은 이 판에서 제거 — 로터 판은
                            #   feat/rotor_remote에 독립 유지 (브랜치 간 merge 금지).
                            #   ★2026-08-06 5차 — **엔진은 1차 + hold 0.2, 매핑은
                            #   사용자 지정** (사용자 확정 2건: "타임 조정만 했는데
                            #   인식이 잘 되던데" + "제스처 지정한 것은 유지하면서
                            #   값만 들고와야지"): 판정 엔진은 사용자가 1차 배포본
                            #   에서 hold_sec 0.35→0.2로 조정해 실측 비교로 고른
                            #   1차를 쓰고, 자세→이벤트 매핑은 2차 지정을 유지한다.
                            #   2~4차 엔진 개정(정지 게이트·기준 보정·z 젖힘)은
                            #   실기에서 1차보다 못해 폐기 — 구현·근거는 히스토리
                            #   보존(2차 4a98f97 · 3차 26063d5 · 4차 08f3a20).
                            #   판정 원리(1차): 꺾임각 = 손 방향(손목→중지 뿌리) −
                            #   전완 방향(포즈 팔꿈치→손목, 관측 없으면 수직 가정
                            #   — 실기에선 포즈 팔이 자주 안 잡혀 사실상 수직 기준,
                            #   즉 손이 가리키는 화면 절대 방향으로 동작한다).
                            #   - 펼친 손 꺾임 = 손이 가리키는 화면 4방위:
                            #     좌 left · 우 right · **위 home · 아래 back**
                            #     (★2026-08-06 8차 사용자 지정 매핑)
                            #   - **검지 주먹(포인팅) 4방위** (★9차 사용자 지정):
                            #     위 = **select** · 하/좌/우 = temp_down/left/right
                            #   - **주먹**: 평평(수직 ±fist_flat_max_deg — 그냥 쥔
                            #     주먹) = **temp**(무방향) · 꺾임 4방위 =
                            #     temp_up/down/left/right (9차 — 8차 "주먹 =
                            #     select"는 폐기. 예비 동작 표시용 실제 이벤트.
                            #     뒤집기 폐기(8차)는 유지 — 손등/손바닥 분리·
                            #     다수결·옆면 보류 없음, 외적 부호는 계측 F=만)
                            #   - **OK 사인 = confirm** (8차 신설): 엄지·검지 끝
                            #     고리 + 중지~새끼 폄 — hand_shape.is_ok_sign
                            #   - ★7차(사용자 확정 "판정 똑같게"): 펼친 손 중립
                            #     (open_flat) 소멸 — 세 모양(펼침·검지·주먹) 전부
                            #     같은 4방위 각도 판정이다. 위 섹터 특례 계보는
                            #     아래 키 소멸 주석 참고
                            #   - temp 계열은 발화해도 쿨다운을 안 건다 — 예비
                            #     자세 직후의 본 제스처가 씹히지 않게 (hand_bend)
                            #   - ★10차(사용자 확정 "잡히고 고정"): 획득 = **자세
                            #     발화** — 중재기(hand_arbiter bend 모드)가 후보 손
                            #     (최대 2)을 슬롯별 자세 판정기로 경쟁시켜 먼저
                            #     발화한 손을 잠근다. 정지한 손도 자세만 보이면
                            #     잡힌다(이동 획득 전제 소멸 — 구 쓸기 스택은 bend
                            #     모드에서 완전히 빠짐). 쉬는 손 방어는
                            #     compete_below_shoulder_max(휴식 존 게이트)
                            #   섹션 삭제 시 꺾임 판 없음(종전 — 쓸기가 그대로 나간다)
  # ※구 판정 관문 키 3종(flat_max_deg 22·bend_min_deg 40·raise_above_shoulder
  #   0.55)은 ★2026-08-06 7차 **소멸**(사용자 확정 — "왼 오 하도 어차피
  #   침범하는데 상만 다르니 안 되는 것. 판정 똑같게 만들라"): 펼친 손은
  #   4방위 섹터(±45·±135 — compass_posture의 기하 상수, 튜닝값 아님)가 곧
  #   자세다. 위 섹터 = select — 좌/우/하와 **완전히 같은 각도 판정**(높이·
  #   어깨 앵커·z 전부 판정 미사용, 계측 표시로만 남는다: 로그 up=·z=).
  #   평평 중립(open_flat)·히스테리시스(22~40 보류)도 함께 소멸 — 쉬는 펼친
  #   손의 select 남발은 발화 1회 래치(재발화는 다른 자세 경유 후)·유지
  #   시간(hold_sec)·쿨다운(cooldown_sec)이 막는다. 1차 "평평 select 남발"
  #   강등 이력의 재수용이다 — 사용자가 실기 비교로 확정했다.
  #   구 위 방향 계보(전부 폐기): 1차 평평 → 2D 40~45 띠 → z 정적 → z 스냅 →
  #   높이 0.9 → 높이 0.55(실측 보정: 들기 최대 +0.77·전형 +0.60~0.77, 어깨
  #   관측 부풀기 +21% — 같은 날 14:48·15:06 로그) → 7차 4방위 통일.
  #   위 섹터 이벤트가 쉬는 손에 남발되면: postures의 bend_up 줄 삭제가 아니라
  #   hold_sec부터 올려 볼 것 — 판정 비대칭으로 돌아가는 것이 마지막 수단
  compete_below_shoulder_max: 1.6  # 잠금 경쟁(판정 손 확정 전) 발화 허용 최저 높이 —
                            #   손 중심이 어깨선 아래 이 값(어깨너비 배수)보다
                            #   깊으면 경쟁에서 관측 없음 취급(발화 보류).
                            #   ★2026-08-06 10차 — 이동 획득을 자세 획득으로
                            #   바꾸면서 이동 관문이 하던 **소음 필터**의 대체
                            #   (채택 가설: 높이 게이트. 기각: 이동 이력 요구 —
                            #   정지 손을 잡는 목적과 모순 / 자세별 비대칭 —
                            #   "판정 똑같게" 원칙 위배): 쉬는 손(배 위·늘어뜨림)
                            #   도 자세로 읽혀(늘어뜨린 펼친 손 = bend_down ->
                            #   back) 오발·오잠금 위험이 있다. 실측(16:09 세션
                            #   계측 up=): 내린 손 -1.99 · 제스처 발화 존
                            #   -0.45~-1.04(과도기 1건 -1.48) — 1.6이 사이를
                            #   가른다. ★잠금 뒤에는 게이트 없음(확정 손의 획이
                            #   아래로 내려가도 안 잘린다). 앵커 미관측이면
                            #   게이트 없음(인식 우선). 쉬는 손이 잡히면 ↓ 1.3,
                            #   낮은 제스처가 경쟁에서 안 잡히면 ↑ 1.8.
                            #   키 삭제 시 게이트 없음
  fist_flat_max_deg: 22     # 평평 주먹 인정 최대 꺾임각(도) — 이 안이면 무방향
                            #   temp, 넘으면 temp_<방향>. ★2026-08-06 9차 보강
                            #   (사용자 지정 "그냥 주먹 평평도 temp로 넣어라").
                            #   값은 구 flat_max_deg(22 — 7차 소멸)의 재사용:
                            #   당시 "살짝 기운 주먹" 실기 근거가 그대로 유효하다.
                            #   ※평평 존은 **주먹에만** 있다 — 검지 주먹·펼친
                            #   손은 위 방향이 본 제스처(select·home)라 평평 존이
                            #   그걸 잘라먹으면 안 된다. 다 temp라 경계 오차의
                            #   실해는 없다 — 기운 주먹이 temp_*로 나가면 ↑
  ok_touch_palm_ratio: 0.45 # OK 사인 고리 닫힘 임계 — 엄지 끝↔검지 끝 3D 거리가
                            #   손바닥 폭(검지 뿌리↔새끼 뿌리) x 이 값 이하 + 중지~
                            #   새끼 폄이면 OK(confirm). ★2026-08-06 8차 신설(사용자
                            #   지정 "ok 손표시 confirm") — 손바닥 폭 비례라 손
                            #   크기·카메라 거리 무관. 실기(16:09 세션): 손등쪽 OK
                            #   0.11~0.43으로 이 경로가 잘 잡는다. 손등 OK가 confirm
                            #   안 나가면 ↑ 0.55, 오발이면 ↓ 0.35
  ok_touch_screen_ratio: 0.45 # ★손바닥쪽 OK 구제(2026-08-06 — 사용자 제안 "엄지와
                            #   검지가 맞닿았는지 로직만 추가"): 위 3D 경로가 못
                            #   잡을 때 **화면(2D)** 고리 거리로 한 번 더 판별.
                            #   실기(16:09): 손바닥쪽 OK는 월드 재구성이 검지를
                            #   폄으로 환각해 3D 고리가 0.57~0.91로 부풀었다 —
                            #   진짜 펼친 손(0.58~1.3)과 겹쳐 임계 분리 불가.
                            #   화면 랜드마크는 이미지에서 직접 회귀돼 고리를
                            #   제대로 그린다(카메라 창 골격 관찰) — 그걸 쓴다.
                            #   중지~새끼 폄 조건 유지 — 주먹도 엄지가 화면상
                            #   검지에 붙으므로 이 조건이 주먹 OK 오발을 막는다.
                            #   초안값(2D 실기 미측정 — 계측 ok2= 로그로 조정):
                            #   손바닥 OK가 여전히 home이면 ↑ 0.55, 펼친 손이
                            #   confirm 오발이면 ↓ 0.35. **키 삭제 시 구제 경로
                            #   없음**(3D 단독 — 손등쪽 OK만 인식)
  hold_sec: 0.2             # 꺾임 자세 유지 시간(초) — ★2026-08-06 사용자 실측 확정
                            #   0.35 → 0.2. 같은 날 0.15로 내렸다가 **되돌림**(사용자
                            #   실기: "반응 지연 줄이니 잘 안 잡히네") — 5프레임로는
                            #   판별 출렁임 속에서 유지 시간이 자꾸 끊겨 오히려 인식이
                            #   나빠졌다. 0.2가 실기 검증 하한이다 — 더 내리지 말 것
  flat_hold_sec: 0.9        # 모양 자세(OK confirm) 유지 시간 — 전환 중 지나가기
                            #   쉬운 자세라 방향 자세보다 길게. 키 이름은 구
                            #   "평평 주먹" 시절 유산. ★9차부터 OK 전용 — 주먹은
                            #   방향 자세(temp 계열)가 되어 hold_sec(0.2)을 쓴다:
                            #   temp는 예비 동작 표시라 빨라야 의미가 있다.
                            #   (구 주먹 발화용 실측 이력: 0.9 → 0.5 → 0.7 → 0.9
                            #   원복 — 주먹 판별 흔들림 근거는 temp 오발이 심하면
                            #   참고할 것)
  cooldown_sec: 0.6         # 발화 직후 입력 무시 시간 — 같은 자세 이중 확정 방지.
                            #   ★2026-08-06 사용자 실측 0.6 → 0.4 → 0.5 → **0.6
                            #   원복 확정** (원점 — 단축 시도는 인식만 나빠졌다)
  postures:                 # 자세 -> 파이프 이벤트 (매핑 교체는 여기서만).
                            #   ★2026-08-06 9차 사용자 지정("손가락있는 주먹
                            #   상은 select, 검지 주먹 하좌우·주먹 상하좌우는
                            #   temp"): 8차의 fist(단일 자세) select는 폐기 —
                            #   주먹·검지 주먹도 4방위 자세(fist_*·finger_*)가
                            #   되고, temp 계열은 델파이 예비 동작 표시용이다.
                            #   줄을 지우면 그 자세는 중립(발화 없음).
                            #   ※open_flat 자세는 7차에서 소멸 — 펼친 손은 항상
                            #   4방위 중 하나다 (위 키 소멸 주석 참고)
    bend_left: left
    bend_right: right
    bend_up: home
    bend_down: back
    finger_up: select
    finger_down: temp_down
    finger_left: temp_left
    finger_right: temp_right
    fist_flat: temp
    fist_up: temp_up
    fist_down: temp_down
    fist_left: temp_left
    fist_right: temp_right
    ok_sign: confirm

classes:                    # 표준 동작 목록 — UI/이벤트 수신부와의 계약.
                            # ★2026-08-06 9차: temp_* 4종 추가 — 검지 주먹
                            # 하/좌/우·주먹 4방위의 예비 동작 표시 이벤트
                            # (델파이가 실제로 받는다. hand_bend 섹션 주석).
                            # 본 이벤트 6종 전부 hand_bend 자세에서 나온다 —
                            # 쓸기·탭·쥐기 이벤트는 파이프로 안 나간다(삼킴)
                            # 비활성 이전 원본(2026-07-31):
                            # [left, right, select, back, home, confirm,
                            #  temp_left, temp_right, temp_top, click]
  [left, right, home, back, confirm, select,
   temp, temp_up, temp_down, temp_left, temp_right]

event_output:
  # 회사 GUI = 델파이7 프로그램 — 파이프(stdio) 연동 확정(2026-07-23, 회사 요청
  # "print만"): 엔진이 이벤트를 **표준 출력(stdout)에 한 줄씩** 찍고, 델파이가
  # 엔진을 자식 프로세스로 띄워 익명 파이프로 읽는다. 네트워크(UDP·웹소켓) 전면
  # 철회 — 포트·방화벽 이슈 소멸. 규격: GESTURE|이벤트|손|신뢰도|시각 (한 줄,
  # CRLF 종료 — docs/델파이7_연동가이드.md). 로그는 stderr·파일로만 나가 stdout이
  # 이벤트 전용 채널로 유지된다
  mode: stdio             # stdio(파이프 연동 — 배포 기본) | console(로그만 — 개발)
  format: name            # 출력 규격(2026-07-31 사용자 요청 — cmd 창은 이벤트명만):
                          #   name = 이벤트명 한 줄(left/right/select/back/home/confirm)
                          #   text = GESTURE|이벤트|손|신뢰도|시각 (델파이 가이드 §3 규격)
                          #   키 삭제 시 text(종전). 델파이가 손·신뢰도까지 쓰면 text로

logging:
  level: INFO             # DEBUG면 손 판별 계측(hand_measure — 손가락별 3D 비율·판정)이
                          #   로그 파일에 남는다: 실측 튜닝 세션용 (2026-07-28 신설)
  console_level: WARNING  # 콘솔(stderr)은 이 레벨부터만(2026-07-31 사용자 요청 — cmd 창
                          #   이벤트 한 줄 유지): 시작 리포트·전환·이벤트 INFO 줄은
                          #   파일(level)에만 남는다. 콘솔에서도 보려면 INFO로
  save_dir: logs/

runtime:                  # 배포 기준 명세 — 설치가이드.md와 일치해야 한다
  python_version: "3.11.5"
  target_os: windows
  target_gpu: none        # 2026-07-29 포즈 제거 — 추론은 MediaPipe TFLite(CPU) 단독.
                          #   GPU 스택(torch·onnxruntime-gpu)은 포즈용이었고 함께 소멸
  hardware:               # 타깃 하드웨어 명세 기록(2026-07-16 신설) — №12 기기 확정 시 채울 것.
                          #   시작 로그에 실제 감지값(OS·CPU·RAM·엔진)과 나란히 남아 대조된다
    device_model: 미확정   # 기기 모델명 (예: 미니PC 제조사·모델)
    cpu: 미확정
    ram: 미확정
    accelerator: CPU (MediaPipe TFLite/XNNPACK — 2026-07-29 단독 확정)
