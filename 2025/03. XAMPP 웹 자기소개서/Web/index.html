<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이지용의 개인 홈페이지</title>
  <link rel="stylesheet" href="style1.css">
  <link rel="stylesheet" href="style2.css">
</head>
<body>

  <h1 class="title">👋 안녕하세요! 이지용입니다</h1>

  <!-- 1. 본인 사진 -->
  <img src="myphoto.jpg" alt="본인 사진" width="200" />
  <img src="myphoto.jpg" alt="친구 사진" width="200" />
  <img src="myphoto.jpg" alt="카자루 사진" width="200" />

  <!-- 2. 테이블로 자기소개 -->
  <table border="1">
    <tr>
      <th>항목</th>
      <th>내용</th>
    </tr>
    <tr>
      <td>이름</td>
      <td><i>이지용</i></td> <!-- 5. 이탤릭 -->
    </tr>
    <tr>
      <td>전공</td>
      <td>컴퓨터공학</td>
    </tr>
    <tr>
      <td>취미</td>
      <td>운동, 프로그래밍</td>
    </tr>
  </table>

  <!-- 3. 글자 색상 2종 이상, 4. 배경 색상 2종 이상 -->
  <p class="color-red bg-yellow">저는 <strong>개발자</strong>가 되고 싶습니다!</p>
  <p class="color-blue bg-light">지금은 <em>Node.js</em>와 <em>MongoDB</em>를 배우고 있어요.</p>

  <!-- 6. 글씨 크기 다르게 -->
  <p class="small">작은 글씨입니다</p>
  <p class="large">큰 글씨입니다</p>

  <!-- 8. 검색엔진 이미지 링크 -->
  <div class="search-links">
    <a href="https://www.naver.com" target="_blank">
      <img src="naver.png" alt="네이버" width="80">
    </a>
    <a href="https://www.google.com" target="_blank">
      <img src="google.png" alt="구글" width="80">
    </a>
  </div>

  <!-- 추가점수: 좋아하는 유튜브 영상 삽입 -->
  <h3>🎬 좋아하는 유튜브 영상</h3>
  <iframe width="560" height="315" src="https://www.youtube.com/watch?v=9XttLI0oH0I&list=RD9XttLI0oH0I&start_radio=1&ab_channel=RESCENE"
    title="YouTube video player" frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen></iframe>

</body>
</html>
