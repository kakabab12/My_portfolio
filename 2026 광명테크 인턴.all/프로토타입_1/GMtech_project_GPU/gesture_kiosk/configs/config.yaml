# gesture_kiosk 설정 — 모든 튜닝값의 단일 출처 (기획서 4.7 : 코드에 숫자 하드코딩 금지)
#
# 2026-07-10 전면 개편 — 타깃: 윈도우 + NVIDIA GPU + Python 3.11.5 (정부 민원발급기)
# 동작 체계(신규 스펙): 주먹→펴기 이동(왼손=왼쪽·오른손=오른쪽) / OK=선택·확인 통일 /
#                       양 손바닥 10초=처음으로. 기존 5.1 초안 동작은 legacy 토글로 유지.
#
# 2026-07-15 CPU+GPU 하이브리드 실기 튜닝 — 포즈(RTMPose)·OCR(EasyOCR)을 device: auto /
# ocr.gpu: true로 CUDA 우선 시도하게 하고, 포즈는 완전 비동기 워커로 분리
# (realtime_loop._start_pose_worker)해 메인 추론 루프가 MediaPipe(CPU, 라이선스 안전 —
# AGPL 리스크 있는 onnx 엔진은 채택 안 함) + 캡처 + 드로잉만 부담하게 했다.
# 이 개발 PC(MX250·Pascal/CC 6.1)는 실측 결과 onnxruntime-gpu·torch 둘 다 이 세대 GPU용
# 커널이 없어 CUDA가 실제로는 못 돈다(위 pose_mode 참고) — pose_estimator.py·
# idcard_reader.py에 "GPU로 한 번 실행해보고 실패하면 CPU로 강등" 로직을 넣어뒀으니
# RTX 30시리즈 이상(설치가이드.md 기준)에서는 자동으로 실제 CUDA 가속이 걸린다.
# 목표는 추론 루프 처리 능력 60 FPS — 단, 이 PC 웹캠은 요청 FPS와 무관하게 실측상
# 정확히 30 FPS로 고정되는 하드웨어 한계가 있다(camera 절 참고). 그래서 "카메라 FPS 60"은
# 이 하드웨어로는 불가능하고, 대신 추론 루프에 60 FPS 여유를 둬 캡처가 병목이 되지
# 않게(그리고 새 프레임을 기다리는 지연을 최소화) 하는 것이 목표다.

camera:
  device_id: 0            # USB 웹캠 장치 번호
  width_px: 640           # 2026-07-15 실측(scripts/benchmark.py --source camera, MediaPipe
  height_px: 480          #   단독): 1280x720=평균 12.0 FPS(80.7ms) vs 640x480=평균 38.7 FPS
                          #   (25.7ms, p95 47ms) — 3.2배 차이. MediaPipe 비용이 입력 픽셀 수에
                          #   비례해 720p는 배포에 못 씀. GPU판도 CPU판(feat/think_win_cpu)과
                          #   동일하게 640x480 채택 — 제스처 엔진이 MediaPipe(CPU)로 고정인 한
                          #   이 결론은 GPU 유무와 무관
  mirror: true            # 거울 모드 — 사용자 기준 좌/우와 이동 방향을 일치시킨다
  windows_backend: msmf   # 윈도우 캡처 백엔드: msmf | dshow | auto
                          #   Brio 100 실측(2026-07-10): dshow는 YUY2 720p로만 협상돼 ~5 FPS,
                          #   msmf는 30 FPS. 오픈이 수십 초 걸리는 장치면 dshow로 되돌릴 것
                          #   2026-07-15 실측: 640x480·1280x720 어느 쪽이든 CAP_PROP_FPS를
                          #   60으로 요청해도 MSMF·DSHOW 둘 다 30으로 협상되고, 워밍업 후
                          #   실측 스루풋도 29.9 FPS — 이 웹캠의 펌웨어 한계다. 카메라
                          #   FPS를 60에 가깝게 만드는 건 소프트웨어로 불가능 — 60 FPS
                          #   캡처가 꼭 필요하면 60 FPS 지원 카메라로 교체해야 한다
  fourcc: mjpg            # 캡처 픽셀 포맷 — 무압축(YUY2) 720p는 USB 한계로 ~5 FPS. auto면 미설정
                          #   (msmf는 이 설정을 무시하기도 한다 — dshow 계열 카메라용)

model:
  # 2026-07-10 라이선스 C안 — 제스처: MediaPipe(Apache-2.0) / 포즈: rtmlib RTMPose(Apache-2.0)
  gesture_engine: mediapipe   # mediapipe(기본 — 라이선스 C안) | onnx(구 HaGRID YOLOv10 —
                              #   AGPL(ultralytics) 리스크로 상업 납품 금지, 비교 시험 전용)
  mediapipe:                  # 손 랜드마크 기반 판정 (detector_mediapipe.py)
    hand_landmarker_path: models/weights/hand_landmarker.task   # 구글 배포 모델 (Apache-2.0)
    num_hands: 2              # 동시 추적 손 개수 — 양 손바닥 '처음으로' 판정에 2 필요
    min_tracking_confidence: 0.5
    finger_extended_ratio: 1.15   # TIP이 PIP보다 손목에서 이 배율 이상 멀면 "손가락 폄"
    ok_pinch_ratio: 0.35          # 엄지-검지 끝 거리 / 손 크기 — 이 미만이면 OK 판정
    bbox_pad_ratio: 0.15          # 랜드마크 -> 손 박스 패딩 (person_lock 손목 귀속용)
    flip_handedness: true         # 좌/우 라벨 뒤집기 — mediapipe 0.10.35가 문서와 반대로
                                  #   라벨을 내는 것 실측(구글 이슈 #4724). 데모 화면 손 박스의
                                  #   L/R이 실제 손과 뒤집혀 보이면 이 값을 반전할 것
  device: auto            # auto(CUDA 있으면 사용) | cuda | cpu — 기본 엔진(mediapipe)에는
                          #   영향 없음. 실제로는 포즈(rtmlib PoseEstimator)에만 적용됨
  use_tensorrt: false     # true면 onnx 엔진에 TensorRT 가속 적용 (첫 실행 때 PC 전용 엔진
                          #   캐시 생성) — gesture_engine=mediapipe(기본)에는 무의미. 포즈
                          #   (rtmlib)도 onnxruntime 'cuda' 프로바이더만 골라 쓰므로
                          #   TensorRT 미지원 — 이 값을 켜도 포즈는 그대로 CUDA로 돈다
  gesture_onnx_path: models/weights/YOLOv10n_gestures.onnx   # (onnx 엔진 전용) HaGRIDv2 제스처
  pose_mode: lightweight  # rtmlib 포즈 크기: lightweight(빠름) | balanced | performance(정확)
                          #   2026-07-15 실측: 이 PC의 MX250(Pascal/CC 6.1)은 onnxruntime-gpu
                          #   1.23.2의 CUDA 커널·EasyOCR(torch cu128) 둘 다 "no kernel image
                          #   available"/"SM < 7.5" 오류로 GPU 실행이 불가 — pose_estimator가
                          #   기동 시 자동으로 CPU로 강등한다(아래 참고). CPU에서 balanced는
                          #   758ms/회(1.3 FPS)까지 떨어져 못 씀 — lightweight만 CPU에서 실용적
                          #   (RTX 30시리즈 이상 배포 PC에서는 GPU가 정상 동작하므로 balanced로
                          #   올려도 됨 — 배포 전 실기로 재확인할 것)
  input_size_px: 640
  max_infer_fps: 60       # 추론 루프 FPS 상한 — 2026-07-15: 포즈(RTMPose)·OCR을 GPU
                          #   비동기 워커로 완전히 분리해 메인 루프가 MediaPipe+캡처+
                          #   드로잉만 부담하게 된 뒤 30->60으로 상향. 캠 자체가 30 FPS
                          #   고정(camera 절 참고)이라 "새 그림"은 초당 30장뿐이지만, 루프를
                          #   더 빨리 돌리면 "다음 프레임을 기다리는" 지연이 줄어 체감
                          #   반응성이 좋아진다 — 순수 캡처 병목 구간에서는 무해한 낭비.
                          #   과거(2026-07-10) 60 설정 시 캡처가 반토막났던 실측은 포즈가
                          #   메인 루프 안에 있던 시절 것 — capture_fps 재확인 필요(TODO)
  pose_infer_every_n_frames: 30  # 포즈(RTMPose)는 person_lock 갱신용이라 매 프레임 불필요.
                          #   2026-07-15: 포즈를 realtime_loop._start_pose_worker(비동기)로
                          #   분리하면서 이 값의 의미도 바뀜 — 더는 "메인 루프 N프레임마다"가
                          #   아니라 "약 N/30초마다"(ASSUMED_CAMERA_FPS 기준, 새 config 없이
                          #   재사용). 처음엔 GPU를 가정하고 4(~0.13초)로 뒀다가 실기에서
                          #   infer_fps 6.9·CPU 98.9%로 폭락하는 걸 확인 — 이 PC는 GPU
                          #   폴백으로 포즈가 CPU에서 ~110ms/회 돈다(위 pose_mode 참고). 이
                          #   워커는 메인 루프와 스레드만 분리됐을 뿐 같은 물리 CPU 코어를
                          #   두고 경쟁하므로, 촘촘히 돌리면 GIL/코어를 뺏겨 MediaPipe 쪽이
                          #   같이 느려진다 — 30(~1초)으로 늦춰 CPU 점유율을 낮춤(실측 후
                          #   조정, 아래 infer_fps 기록 참고). GPU가 실제로 동작하는 PC
                          #   (smoke_test.py 실행 장치=cuda 확인 시)에서는 더 촘촘히 낮춰도 됨
  class_map:              # 모델 출력 class_name -> 표준 제스처. 미등록 클래스는 무시된다
    # --- 신규 스펙 ---
    fist: fist            # 주먹 — "쥐었다 펴기" 이동의 시작 상태
    palm: open_hand       # 손바닥(펴기) — 이동의 끝 상태 + 양손 '처음으로'
    stop: open_hand
    stop_inverted: open_hand
    four: open_hand
    ok: ok                # OK사인 — 선택/확인 통일
    # --- 레거시(기획서 5.1 초안) — gestures.legacy.enabled=true일 때만 판정 ---
    point: point
    one: point
    like: thumbs_up

person_lock:              # 오토포커스 카메라 — 초점 맞은 사용자에게 잠금, 다른 사람 손 무시
  enabled: true
  kpt_conf_threshold: 0.3     # 포즈 키포인트(손목·머리) 최소 신뢰도
  lock_frame_count: 3         # 최고 점수 후보가 N프레임 연속이면 그 사용자에게 잠금
  follow_radius_ratio: 0.25   # 잠금 유지·추적 반경 (프레임 폭 대비 비율)
  release_sec: 2.0            # 이 시간 동안 안 보이면 잠금 해제 — 다음 사용자 인식
  wrist_match_ratio: 0.14     # 제스처 박스를 손목에 귀속시키는 최대 거리 (프레임 폭 비율)
  sharpness_weight: 0.5       # 사용자 선정 점수에서 초점 선명도 비중 (0=크기만, 1=선명도만)

detect:
  conf_threshold: 0.5
  cooldown_sec: 1.0           # 이벤트 확정 직후 입력 무시 시간 — 연타 방지

gestures:
  move:                       # 주먹 쥐었다 펴기 = 포커스 1칸 이동 (왼손=move_left, 오른손=move_right)
    fist_min_frames: 3        # 주먹이 N프레임 연속이면 "장전"
    open_within_sec: 0.8      # 장전 후 이 시간 안에 손바닥이 펴지면 이동 확정
  select:                     # OK 사인 = 선택/확인 (겹치므로 하나로 통일)
    stable_frame_count: 5     # N프레임 연속 유지 시 확정
    max_static_move_ratio: 0.08   # 정적 포즈로 인정하는 최대 이동량 (프레임 폭 비율)
  two_palm:                   # 양 손바닥 유지 = 처음으로 (기존 직원호출과 충돌 → action으로 선택)
    action: go_home           # go_home(신규 스펙 기본) | help_call(레거시 직원 호출)
    hold_sec: 10.0            # 이 시간 이상 유지되면 확정
    grace_sec: 0.4            # 인식이 잠깐 끊겨도 유지로 보는 허용 시간
  legacy:                     # 기획서 5.1 초안 동작 — 회사 협의(№1) 후 정리 예정
    enabled: false            # 2026-07-10 기본 꺼짐 — 켜면 쉬고 있는 손바닥이 palm_stop을
                              #   반복 발사해 쿨다운으로 신규 스펙(이동·선택·처음으로)을 막는다
    stable_frame_count: 5     # 정적(point/palm_stop/thumbs_up) N프레임 연속 판정
    max_static_move_ratio: 0.08
    swipe:
      source_gesture: open_hand   # 손바닥 궤적으로 스와이프 판정 (한 손일 때만)
      window_sec: 0.7
      min_dist_ratio: 0.35

ocr:                        # 주민등록증 인식 — 이름·주민등록번호 자동 입력
  enabled: true
  engine: easyocr           # 현재 easyocr 단일 구현 (교체 지점)
  languages: [ko, en]
  gpu: true                 # 윈도우+NVIDIA에서 true, 미지원 환경은 자동 CPU 폴백
  interval_frames: 15       # OCR 모드 중 N프레임마다 1회 인식 시도 (매 프레임은 낭비)
  timeout_sec: 30.0         # OCR 모드 자동 종료 시간 — UI가 다시 요청하면 재시작
  min_text_conf: 0.4        # 인식 문자열 최소 신뢰도
  guide_region_ratio: [0.15, 0.15, 0.85, 0.85]  # 인식 대상 중앙 영역 (x1,y1,x2,y2 비율)
  # 개인정보 원칙(개인정보보호법 — 주민등록번호 처리 법적 근거는 회사 확인 필요, TODO №11):
  #  - 카메라 프레임·인식 결과를 디스크에 저장하지 않는다
  #  - 로그에는 반드시 마스킹된 값만 남긴다 (예: 홍*동 / 950101-1******)

announce:                   # 토크백(보이스오버) — 현재 위치·기능 음성 안내
  enabled: true
  backend: tts              # tts(pyttsx3 — 윈도우 SAPI/맥 nsss) | log(개발용: 로그로만 출력)
  rate_wpm: 200             # 말하기 속도
  volume: 1.0
  event_templates:          # 제스처 이벤트 자동 안내 문구 ({side}=왼/오른)
    move_left: "왼쪽으로 이동"
    move_right: "오른쪽으로 이동"
    select: "선택했습니다"
    go_home: "처음 화면으로 돌아갑니다"
    help_call: "직원을 호출했습니다. 잠시만 기다려 주세요"
    fill_id_fields: "주민등록증 인식 완료. 이름과 주민등록번호가 입력되었습니다"
  # UI 화면 안내(현재 포커스 항목 설명)는 UI가 POST /announce {"text": "..."}로 요청한다
  # (회사 프로그램 연동 계약 — 이벤트는 엔진→UI, 음성 안내 요청은 UI→엔진)

classes:                    # 표준 동작 목록 — UI/이벤트 수신부와의 계약
  [move_left, move_right, select, go_home, help_call, fill_id_fields,
   point, palm_stop, swipe_left, swipe_right, thumbs_up]   # 뒤 5개 = 레거시

event_output:
  # TODO(기획서 9장 №7): 회사 키오스크 프로그램의 이벤트 수신 규격(소켓/시리얼/공유메모리)
  #                      확정 후 mode 추가 및 event_sender.py 구현 교체
  mode: console           # console | udp
  udp:
    host: 127.0.0.1
    port: 9999

demo_ui:                  # 예시 UI 서버 — 회사 프로그램 인수 후 제거 예정
  host: 0.0.0.0
  port: 5000
  stream_fps: 15
  jpeg_quality: 75

logging:
  level: INFO
  save_dir: logs/

runtime:                  # 배포 기준 명세 — 설치가이드.md와 일치해야 한다
  python_version: "3.11.5"
  target_os: windows
  target_gpu: nvidia
